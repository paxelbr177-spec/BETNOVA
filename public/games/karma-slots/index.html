<html>
  <head>

    <title>Karma Slots!</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script type="text/javascript" src="slots.js"></script>
    <link rel="stylesheet" type="text/css" href="slots.css" />
    <!-- Presentación para encajar en BetNova (no altera la lógica del juego original MIT) -->
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        background: radial-gradient(circle at 50% 0%, #15324a, #0a0e1a 60%);
        color: #e8eefc; font-family: system-ui, "Segoe UI", Roboto, sans-serif;
        display: flex; align-items: center; justify-content: center;
      }
      #wrap { transform: scale(1.4); transform-origin: center; text-align: center; }
      button {
        margin: 4px; padding: 8px 12px; border: 0; border-radius: 8px;
        background: #19e57f; color: #0a0e1a; font-weight: 700; cursor: pointer;
      }
      #attribution { margin-top: 12px; font-size: 10px; color: #5e6781; }
      #attribution a { color: #8a94ad; }
    </style>

  </head>
  <body>

    <div id="wrap">

      <div id="game">
        <canvas id="slots" width="160" height="160"></canvas><br />
        <button type="button" onclick="spin(1);">1 Line</button>
        <button type="button" onclick="spin(3);">3 Lines</button>
        <button type="button" onclick="spin(5);">5 Lines</button>
      </div>

      <div id="info">
        <p id="credits"></p>
        <p id="log"></p>
      </div>

      <div id="attribution">
        by <a href="http://clintbellanger.net/rpg/" target="_blank">Clint Bellanger</a> and <a href="http://www.youtube.com/brandon75689" target="_blank">Brandon Morris</a>
      </div>

    </div>

    <script type="text/javascript">
      init();
    </script>

  </body>
</html>
