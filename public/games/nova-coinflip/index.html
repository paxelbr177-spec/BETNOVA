<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Nova Coinflip — BetNova</title>
<link rel="stylesheet" href="../_shared/juice.css" />
<style>
  :root{ --ink:#0a0e1a; --panel:#121829; --panel2:#1a2238; --brand:#19e57f; --gold:#ffc83d; --muted:#8a94ad; --red:#ff4d5e; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{ font-family:"Segoe UI",system-ui,Roboto,sans-serif; color:#e8eefc;
    background:radial-gradient(circle at 50% -10%, #163a55, var(--ink) 60%); min-height:100%; padding:14px; user-select:none; }
  .wrap{ max-width:520px; margin:0 auto; }
  .head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .head h1{ font-size:20px; font-weight:800; } .head h1 span{ color:var(--brand); }
  .head .tag{ font-size:11px; color:var(--muted); background:rgba(255,255,255,.06); padding:4px 10px; border-radius:999px; }
  .card{ background:var(--panel); border:1px solid rgba(255,255,255,.07); border-radius:16px; padding:24px 18px; }
  .stage{ height:200px; display:grid; place-items:center; perspective:800px; }
  .coin{ width:140px; height:140px; position:relative; transform-style:preserve-3d; transition:transform 1.5s cubic-bezier(.25,.8,.3,1); }
  .face{ position:absolute; inset:0; border-radius:50%; backface-visibility:hidden; display:grid; place-items:center;
    font-family:"Sora","Arial Black",sans-serif; font-size:46px; font-weight:900; color:#0a0e1a; box-shadow:0 10px 26px rgba(0,0,0,.5), inset 0 0 0 6px rgba(0,0,0,.12); }
  .cara{ background:radial-gradient(circle at 35% 30%, #ffe89a, #ffc83d 60%, #d99a0c); }
  .cruz{ background:radial-gradient(circle at 35% 30%, #e8eef7, #b8c2d6 60%, #8a94ad); transform:rotateY(180deg); }
  .opts{ display:flex; gap:10px; margin-top:18px; }
  .opt{ flex:1; padding:12px; border-radius:12px; border:1px solid rgba(255,255,255,.1); background:var(--panel2); color:#cdd6ea; font-weight:800; font-size:16px; cursor:pointer; }
  .opt.sel{ border-color:var(--brand); color:#fff; box-shadow:0 0 0 2px rgba(25,229,127,.3) inset; }
  .opt.cara.sel{ box-shadow:0 0 0 2px rgba(255,200,61,.4) inset; border-color:var(--gold); }
  .pay{ text-align:center; color:var(--muted); font-size:12px; margin-top:12px; }
  .pay b{ color:var(--brand); }
  .hud{ display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-top:14px; }
  .stat{ background:var(--panel); border:1px solid rgba(255,255,255,.07); border-radius:10px; padding:9px; text-align:center; }
  .stat span{ display:block; font-size:10px; color:var(--muted); text-transform:uppercase; }
  .stat b{ font-size:18px; } .stat b.bal{ color:var(--brand);} .stat b.win{ color:var(--gold);}
  .controls{ display:flex; gap:10px; margin-top:14px; }
  .bet{ display:flex; align-items:center; gap:6px; background:var(--panel); border:1px solid rgba(255,255,255,.07); border-radius:12px; padding:8px 10px; }
  .bet button{ width:32px; height:32px; border-radius:8px; border:0; background:var(--panel2); color:#fff; font-size:18px; cursor:pointer; }
  .bet .v{ min-width:54px; text-align:center; font-weight:700; }
  .act{ flex:1; height:50px; border:0; border-radius:13px; cursor:pointer; font-size:17px; font-weight:800; color:var(--ink); background:linear-gradient(180deg,var(--brand),#0fb863); box-shadow:0 0 22px rgba(25,229,127,.4); }
  .act:disabled{ opacity:.5; cursor:not-allowed; box-shadow:none; }
  .msg{ text-align:center; min-height:22px; margin-top:10px; font-weight:700; color:var(--gold); }
  .foot{ margin-top:8px; text-align:center; font-size:10px; color:#5e6781; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="head"><h1>Nova <span>Coinflip</span></h1><span class="tag">Desarrollado por BetNova</span></div>
    <div class="card">
      <div class="stage">
        <div class="coin" id="coin">
          <div class="face cara">C</div>
          <div class="face cruz">X</div>
        </div>
      </div>
      <div class="opts">
        <div class="opt cara sel" id="optCara">🪙 CARA</div>
        <div class="opt" id="optCruz">⚪ CRUZ</div>
      </div>
      <div class="pay">Acierta y cobras <b id="payx">1.96x</b> tu apuesta</div>
    </div>
    <div class="hud">
      <div class="stat"><span>Saldo</span><b class="bal" id="balance">1000.00</b></div>
      <div class="stat"><span>Ganancia</span><b class="win" id="winDisp">0.00</b></div>
    </div>
    <div class="controls">
      <div class="bet"><button id="betDown">−</button><div class="v" id="betVal">10</div><button id="betUp">+</button></div>
      <button class="act" id="flipBtn">LANZAR</button>
    </div>
    <div class="msg" id="message">Elige cara o cruz y lanza 🪙</div>
    <div class="foot">Nova Coinflip · juego original de BetNova · 50% · pago 1.96x (casa 2%)</div>
  </div>
<script src="../_shared/house.js"></script>
<script src="../_shared/wallet-bridge.js"></script>
<script src="../_shared/juice.js"></script>
<script>
(function(){
  const BETS=[50,100,250,500,1000]; let betIdx=0;
  const PAYOUT=1.96;
  let balance=1000, pick='cara', rot=0, flipping=false;
  const $=(id)=>document.getElementById(id);
  const fmt=(n)=>n.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2});

  let actx=null; const ac=()=>{ if(!actx){try{actx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}} if(actx&&actx.state==='suspended')actx.resume(); return actx; };
  function tone(f,d,t,v){ const c=ac(); if(!c)return; const o=c.createOscillator(),g=c.createGain(); o.type=t||'sine'; o.frequency.value=f; g.gain.setValueAtTime(0.0001,c.currentTime); g.gain.exponentialRampToValueAtTime(v||0.1,c.currentTime+0.01); g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+d); o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d+0.02); }
  const sndFlip=()=>{ for(let i=0;i<5;i++) setTimeout(()=>tone(900+Math.random()*300,0.05,'square',0.05),i*120); };
  const sndWin=()=>{ [523,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,0.16,'triangle',0.12),i*80)); };
  const sndLose=()=>tone(300,0.3,'sine',0.08);

  NovaWallet.ready(b=>{ balance=b; syncUI(); });
  NovaWallet.onBalance(b=>{ balance=b; syncUI(); });

  function syncUI(){
    $('balance').textContent=fmt(balance);
    $('betVal').textContent=BETS[betIdx];
    $('payx').textContent=PAYOUT.toFixed(2)+'x';
    $('optCara').classList.toggle('sel',pick==='cara');
    $('optCruz').classList.toggle('sel',pick==='cruz');
  }
  const setMsg=(t)=>$('message').textContent=t;

  function flip(){
    if(flipping)return; const bet=BETS[betIdx];
    if(balance<bet){ setMsg('Saldo insuficiente.'); return; }
    balance=NovaWallet.bet(bet); flipping=true; $('flipBtn').disabled=true; syncUI(); setMsg('🪙 Lanzando…'); sndFlip();
    const canWin = (window.NovaHouse ? NovaHouse.allowWin() : true);
    const other = pick==='cara' ? 'cruz' : 'cara';
    const result = canWin ? pick : other;
    // girar varias vueltas y aterrizar en la cara correcta (cara=par, cruz=impar de medias vueltas)
    rot += 360*4;
    const desiredParity = result==='cruz' ? 1 : 0;
    if(((rot/180)%2+2)%2 !== desiredParity) rot += 180;
    $('coin').style.transform = 'rotateY('+rot+'deg)';
    setTimeout(()=>finish(result,bet), 1550);
  }

  function finish(result,bet){
    const won = result===pick;
    if(won){ const win=bet*PAYOUT; balance=NovaWallet.win(win); $('winDisp').textContent=fmt(win);
      setMsg(`✅ ¡Salió ${result.toUpperCase()}! Ganaste ${fmt(win)}`); sndWin();
      if(window.Juice) Juice.coins({count:60}); }
    else{ $('winDisp').textContent=fmt(0); setMsg(`❌ Salió ${result.toUpperCase()}. Perdiste.`); sndLose(); }
    flipping=false; $('flipBtn').disabled=false; syncUI();
  }

  $('optCara').addEventListener('click',()=>{ if(!flipping){pick='cara';syncUI();} });
  $('optCruz').addEventListener('click',()=>{ if(!flipping){pick='cruz';syncUI();} });
  $('flipBtn').addEventListener('click',()=>{ ac(); flip(); });
  $('betUp').addEventListener('click',()=>{ if(!flipping&&betIdx<BETS.length-1){betIdx++;syncUI();} });
  $('betDown').addEventListener('click',()=>{ if(!flipping&&betIdx>0){betIdx--;syncUI();} });
  syncUI();
})();
</script>
</body>
</html>
