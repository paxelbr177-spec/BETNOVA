<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Nova Cups — BetNova</title>
<link rel="stylesheet" href="../_shared/juice.css" />
<style>
  :root{ --brand:#19e57f; --ink:#0a0e1a; --panel:#121829; --panel2:#1a2238; --gold:#ffc83d; --muted:#8a94ad; --red:#ff4d5e; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{ font-family:"Segoe UI",system-ui,Roboto,sans-serif; color:#e8eefc;
    background:radial-gradient(circle at 50% -10%, #163a55, var(--ink) 60%);
    min-height:100%; padding:12px; user-select:none; -webkit-user-select:none; }
  .wrap{ max-width:520px; margin:0 auto; }
  .head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .head h1{ font-size:20px; font-weight:800; } .head h1 span{ color:var(--brand); }
  .head .tag{ font-size:11px; color:var(--muted); background:rgba(255,255,255,.06); padding:4px 10px; border-radius:999px; }
  .stage{ position:relative; border-radius:16px; overflow:hidden; border:1px solid rgba(255,255,255,.08);
    background:radial-gradient(circle at 50% 20%, #11203a, #0a1120 70%); box-shadow:0 14px 40px rgba(0,0,0,.5);
    padding:18px 10px 22px; }
  .table{ height:10px; margin:0 14px; border-radius:50%; background:rgba(0,0,0,.4); box-shadow:0 8px 18px rgba(0,0,0,.5); }
  .cups{ display:flex; justify-content:center; gap:10px; align-items:flex-end; min-height:150px; }
  .slot{ position:relative; width:30%; max-width:128px; }
  .cup{ width:100%; cursor:pointer; transition:transform .18s ease; transform-origin:bottom center; display:block; }
  .slot.pickable .cup:hover{ transform:translateY(-6px); }
  .slot.lifted .cup{ transform:translateY(-58px); }
  .slot.shake .cup{ animation:wob .28s ease; }
  @keyframes wob{ 0%,100%{transform:translateY(0) rotate(0)} 25%{transform:translateY(-6px) rotate(-5deg)} 75%{transform:translateY(-6px) rotate(5deg)} }
  .ball{ position:absolute; left:50%; bottom:6px; width:38%; max-width:48px; transform:translateX(-50%) scale(0); opacity:0; transition:transform .25s, opacity .2s; pointer-events:none; }
  .ball.show{ transform:translateX(-50%) scale(1); opacity:1; }
  .mult{ position:absolute; top:8px; left:50%; transform:translateX(-50%); font-size:13px; font-weight:700; color:var(--gold); opacity:.85; }
  .hud{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px; }
  .stat{ background:var(--panel); border:1px solid rgba(255,255,255,.07); border-radius:10px; padding:9px; text-align:center; }
  .stat span{ display:block; font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; }
  .stat b{ font-size:18px; } .stat b.bal{ color:var(--brand);} .stat b.win{ color:var(--gold);}
  .controls{ display:flex; gap:10px; margin-top:12px; }
  .bet{ display:flex; align-items:center; gap:6px; background:var(--panel); border:1px solid rgba(255,255,255,.07); border-radius:12px; padding:8px 10px; }
  .bet button{ width:32px; height:32px; border-radius:8px; border:0; background:var(--panel2); color:#fff; font-size:18px; cursor:pointer; }
  .bet .v{ min-width:54px; text-align:center; font-weight:700; }
  .act{ flex:1; height:50px; border:0; border-radius:13px; cursor:pointer; font-size:17px; font-weight:800; color:var(--ink); background:linear-gradient(180deg,var(--brand),#0fb863); box-shadow:0 0 22px rgba(25,229,127,.4); transition:filter .15s; }
  .act:disabled{ opacity:.5; cursor:not-allowed; box-shadow:none; }
  .msg{ text-align:center; min-height:22px; margin-top:10px; font-weight:700; color:var(--gold); }
  .foot{ margin-top:8px; text-align:center; font-size:10px; color:#5e6781; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="head"><h1>Nova <span>Cups</span></h1><span class="tag">Desarrollado por BetNova</span></div>
    <div class="stage">
      <div class="mult">Acierta y ganas 2.9x</div>
      <div class="cups" id="cups">
        <div class="slot" data-i="0">
          <svg class="ball" viewBox="0 0 60 60"><defs><radialGradient id="bg0" cx="38%" cy="32%" r="70%"><stop offset="0%" stop-color="#fff6cf"/><stop offset="40%" stop-color="#ffc83d"/><stop offset="100%" stop-color="#b87800"/></radialGradient></defs><circle cx="30" cy="30" r="26" fill="url(#bg0)" stroke="#7a5200" stroke-width="1"/><ellipse cx="22" cy="20" rx="8" ry="5" fill="rgba(255,255,255,.55)"/></svg>
          <svg class="cup" viewBox="0 0 120 150"><defs><linearGradient id="cg0" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#2a5cff"/><stop offset="45%" stop-color="#6ea0ff"/><stop offset="100%" stop-color="#173a9e"/></linearGradient></defs><path d="M22 18 Q60 2 98 18 L86 120 Q60 132 34 120 Z" fill="url(#cg0)" stroke="#0f2a73" stroke-width="2"/><ellipse cx="60" cy="18" rx="38" ry="11" fill="#9cc0ff"/><ellipse cx="60" cy="18" rx="30" ry="7" fill="#1c3f8f"/><path d="M34 120 Q60 132 86 120 L88 130 Q60 144 32 130 Z" fill="#ffc83d" stroke="#a07a00" stroke-width="1.5"/></svg>
        </div>
        <div class="slot" data-i="1">
          <svg class="ball" viewBox="0 0 60 60"><defs><radialGradient id="bg1" cx="38%" cy="32%" r="70%"><stop offset="0%" stop-color="#fff6cf"/><stop offset="40%" stop-color="#ffc83d"/><stop offset="100%" stop-color="#b87800"/></radialGradient></defs><circle cx="30" cy="30" r="26" fill="url(#bg1)" stroke="#7a5200" stroke-width="1"/><ellipse cx="22" cy="20" rx="8" ry="5" fill="rgba(255,255,255,.55)"/></svg>
          <svg class="cup" viewBox="0 0 120 150"><defs><linearGradient id="cg1" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#2a5cff"/><stop offset="45%" stop-color="#6ea0ff"/><stop offset="100%" stop-color="#173a9e"/></linearGradient></defs><path d="M22 18 Q60 2 98 18 L86 120 Q60 132 34 120 Z" fill="url(#cg1)" stroke="#0f2a73" stroke-width="2"/><ellipse cx="60" cy="18" rx="38" ry="11" fill="#9cc0ff"/><ellipse cx="60" cy="18" rx="30" ry="7" fill="#1c3f8f"/><path d="M34 120 Q60 132 86 120 L88 130 Q60 144 32 130 Z" fill="#ffc83d" stroke="#a07a00" stroke-width="1.5"/></svg>
        </div>
        <div class="slot" data-i="2">
          <svg class="ball" viewBox="0 0 60 60"><defs><radialGradient id="bg2" cx="38%" cy="32%" r="70%"><stop offset="0%" stop-color="#fff6cf"/><stop offset="40%" stop-color="#ffc83d"/><stop offset="100%" stop-color="#b87800"/></radialGradient></defs><circle cx="30" cy="30" r="26" fill="url(#bg2)" stroke="#7a5200" stroke-width="1"/><ellipse cx="22" cy="20" rx="8" ry="5" fill="rgba(255,255,255,.55)"/></svg>
          <svg class="cup" viewBox="0 0 120 150"><defs><linearGradient id="cg2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#2a5cff"/><stop offset="45%" stop-color="#6ea0ff"/><stop offset="100%" stop-color="#173a9e"/></linearGradient></defs><path d="M22 18 Q60 2 98 18 L86 120 Q60 132 34 120 Z" fill="url(#cg2)" stroke="#0f2a73" stroke-width="2"/><ellipse cx="60" cy="18" rx="38" ry="11" fill="#9cc0ff"/><ellipse cx="60" cy="18" rx="30" ry="7" fill="#1c3f8f"/><path d="M34 120 Q60 132 86 120 L88 130 Q60 144 32 130 Z" fill="#ffc83d" stroke="#a07a00" stroke-width="1.5"/></svg>
        </div>
      </div>
      <div class="table"></div>
    </div>
    <div class="hud">
      <div class="stat"><span>Saldo</span><b class="bal" id="balance">1000.00</b></div>
      <div class="stat"><span>Apuesta</span><b id="betDisp">50.00</b></div>
      <div class="stat"><span>Ganancia</span><b class="win" id="winDisp">0.00</b></div>
    </div>
    <div class="controls">
      <div class="bet">
        <button id="betDown">−</button><div class="v" id="betVal">50</div><button id="betUp">+</button>
      </div>
      <button class="act" id="actBtn">JUGAR</button>
    </div>
    <div class="msg" id="message">Pon tu apuesta y encuentra la bola 🔮</div>
    <div class="foot">Nova Cups · juego original de BetNova · 1 de 3 · pago 2.9x</div>
  </div>
<script src="../_shared/house.js"></script>
<script src="../_shared/wallet-bridge.js"></script>
<script src="../_shared/juice.js"></script>
<script>
(function(){
  const MULT=2.91;
  const BETS=[50,100,250,500,1000]; let betIdx=0;
  let balance=1000, playing=false, ballPos=-1;
  const $=(id)=>document.getElementById(id);
  const fmt=(n)=>n.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2});

  // Audio (subtle synth for shuffle only; win/bet sounds handled by shared system)
  let actx=null; const ac=()=>{ if(!actx){try{actx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}} if(actx&&actx.state==='suspended')actx.resume(); return actx; };
  function tone(f,d,t,v,glide){ const c=ac(); if(!c)return; const o=c.createOscillator(),g=c.createGain(); o.type=t||'sine'; o.frequency.setValueAtTime(f,c.currentTime); if(glide)o.frequency.exponentialRampToValueAtTime(glide,c.currentTime+d); g.gain.setValueAtTime(0.0001,c.currentTime); g.gain.exponentialRampToValueAtTime(v||0.06,c.currentTime+0.02); g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+d); o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d+0.02); }
  const sndShuffle=()=>tone(280+Math.random()*120,0.09,'triangle',0.05);

  const slots=()=>Array.from(document.querySelectorAll('.slot'));

  function syncUI(){
    $('balance').textContent=fmt(balance);
    $('betDisp').textContent=fmt(BETS[betIdx]);
    $('betVal').textContent=BETS[betIdx];
    $('actBtn').disabled=playing;
    $('betUp').disabled=playing; $('betDown').disabled=playing;
  }
  function setMsg(t){ $('message').textContent=t; }

  function resetBoard(){
    slots().forEach(s=>{ s.classList.remove('lifted','shake','pickable'); s.querySelector('.ball').classList.remove('show'); });
  }

  function shuffle(done){
    let n=0; const total=10;
    const step=()=>{
      const s=slots()[Math.floor(Math.random()*3)];
      s.classList.add('shake'); sndShuffle();
      setTimeout(()=>s.classList.remove('shake'),260);
      if(++n<total) setTimeout(step, 150);
      else setTimeout(done, 320);
    };
    step();
  }

  function startRound(){
    if(playing) return;
    const bet=BETS[betIdx];
    if(balance<bet){ setMsg('Saldo insuficiente.'); return; }
    balance=NovaWallet.bet(bet); playing=true; syncUI();
    $('winDisp').textContent=fmt(0);
    resetBoard();
    setMsg('Mezclando los cubiletes…');
    shuffle(()=>{
      setMsg('¿Bajo cuál está la bola? ¡Elige!');
      slots().forEach(s=>s.classList.add('pickable'));
    });
  }

  function pick(idx){
    if(!playing) return;
    if(!slots()[idx].classList.contains('pickable')) return;
    slots().forEach(s=>s.classList.remove('pickable'));

    // Decide result AFTER the pick so the reveal matches the house gate.
    const canWin=(window.NovaHouse ? NovaHouse.allowWin(MULT) : true);
    if(canWin){ ballPos=idx; }
    else { const others=[0,1,2].filter(i=>i!==idx); ballPos=others[Math.floor(Math.random()*others.length)]; }

    const bet=BETS[betIdx];
    // lift the picked cup
    slots()[idx].classList.add('lifted');
    if(ballPos===idx){ slots()[idx].querySelector('.ball').classList.add('show'); }

    setTimeout(()=>{
      if(ballPos===idx){
        const win=bet*MULT;
        balance=NovaWallet.win(win); $('winDisp').textContent=fmt(win);
        setMsg(`✅ ¡La encontraste! +${fmt(win)}`);
        if(window.Juice) Juice.win(win,{ mult:MULT, el:$('winDisp') });
      } else {
        // reveal where it actually was
        slots()[ballPos].classList.add('lifted');
        slots()[ballPos].querySelector('.ball').classList.add('show');
        setMsg('❌ Fallaste. La bola estaba en otro cubilete.');
      }
      playing=false;
      syncUI();
    }, 480);
  }

  // Wiring
  $('actBtn').addEventListener('click',()=>{ ac(); startRound(); });
  $('betUp').addEventListener('click',()=>{ if(!playing&&betIdx<BETS.length-1){betIdx++;syncUI();} });
  $('betDown').addEventListener('click',()=>{ if(!playing&&betIdx>0){betIdx--;syncUI();} });
  slots().forEach((s,i)=>s.addEventListener('click',()=>{ ac(); pick(i); }));

  // initial render
  syncUI();

  // *** wallet hooks LAST (after $ + functions + initial render) to avoid TDZ ***
  NovaWallet.ready(b=>{ balance=b; syncUI(); });
  NovaWallet.onBalance(b=>{ balance=b; syncUI(); });
})();
</script>
</body>
</html>
