<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Nova Dado — BetNova</title>
<link rel="stylesheet" href="../_shared/juice.css" />
<style>
  :root{ --brand:#19e57f; --ink:#0a0e1a; --panel:#121829; --panel2:#1a2238; --gold:#ffc83d; --muted:#8a94ad; --red:#ff4d5e; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{ font-family:"Segoe UI",system-ui,Roboto,sans-serif; color:#e8eefc;
    background:radial-gradient(circle at 50% -10%, #163a55, var(--ink) 60%);
    min-height:100%; padding:12px; user-select:none; -webkit-user-select:none; }
  .wrap{ max-width:360px; margin:0 auto; }
  .head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .head h1{ font-size:19px; font-weight:800; } .head h1 span{ color:var(--brand); }
  .head .tag{ font-size:10px; color:var(--muted); background:rgba(255,255,255,.06); padding:4px 9px; border-radius:999px; }
  .stage{ position:relative; border-radius:16px; border:1px solid rgba(255,255,255,.08); background:#0a1120; box-shadow:0 14px 40px rgba(0,0,0,.5); padding:18px 10px; }
  .dice{ display:flex; gap:10px; justify-content:center; align-items:center; }
  .die{ width:78px; height:78px; filter:drop-shadow(0 6px 10px rgba(0,0,0,.45)); transition:transform .08s; }
  .die.spin{ animation:tumble .12s linear infinite; }
  @keyframes tumble{ 0%{transform:rotate(-8deg) scale(.96);} 50%{transform:rotate(8deg) scale(1.04);} 100%{transform:rotate(-8deg) scale(.96);} }
  .sum{ text-align:center; margin-top:10px; font-size:13px; color:var(--muted); min-height:18px; }
  .sum b{ color:var(--gold); font-size:16px; }
  .hud{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:10px; }
  .stat{ background:var(--panel); border:1px solid rgba(255,255,255,.07); border-radius:10px; padding:8px; text-align:center; }
  .stat span{ display:block; font-size:9px; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; }
  .stat b{ font-size:16px; } .stat b.bal{ color:var(--brand);} .stat b.win{ color:var(--gold);}
  .lbl{ font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin:12px 0 6px; }
  .seg{ display:grid; grid-template-columns:repeat(2,1fr); gap:6px; }
  .seg button{ border:1px solid rgba(255,255,255,.08); background:var(--panel); color:#e8eefc; border-radius:10px; padding:10px 4px; font-size:13px; font-weight:700; cursor:pointer; transition:all .12s; line-height:1.2; }
  .seg button small{ display:block; font-size:9px; color:var(--muted); font-weight:600; }
  .seg button.sel{ border-color:var(--brand); background:linear-gradient(180deg,rgba(25,229,127,.22),rgba(25,229,127,.08)); box-shadow:0 0 14px rgba(25,229,127,.25); }
  .seg button.sel small{ color:var(--brand); }
  .nums{ grid-template-columns:repeat(6,1fr); }
  .nums button{ padding:10px 0; font-size:16px; }
  .controls{ display:flex; gap:8px; margin-top:12px; }
  .bet{ display:flex; align-items:center; gap:5px; background:var(--panel); border:1px solid rgba(255,255,255,.07); border-radius:12px; padding:7px 8px; }
  .bet button{ width:30px; height:30px; border-radius:8px; border:0; background:var(--panel2); color:#fff; font-size:18px; cursor:pointer; }
  .bet .v{ min-width:46px; text-align:center; font-weight:700; }
  .act{ flex:1; height:48px; border:0; border-radius:13px; cursor:pointer; font-size:16px; font-weight:800; color:var(--ink); background:linear-gradient(180deg,var(--brand),#0fb863); box-shadow:0 0 22px rgba(25,229,127,.4); transition:filter .15s; }
  .act:disabled{ opacity:.5; cursor:not-allowed; box-shadow:none; }
  .msg{ text-align:center; min-height:20px; margin-top:10px; font-weight:700; color:var(--gold); font-size:13px; }
  .foot{ margin-top:8px; text-align:center; font-size:10px; color:#5e6781; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="head"><h1>Nova <span>Dado</span></h1><span class="tag">Desarrollado por BetNova</span></div>
    <div class="stage">
      <div class="dice" id="dice"></div>
      <div class="sum" id="sum">Elige tu apuesta y tira el dado</div>
    </div>
    <div class="hud">
      <div class="stat"><span>Saldo</span><b class="bal" id="balance">1000.00</b></div>
      <div class="stat"><span>Apuesta</span><b id="betDisp">50.00</b></div>
      <div class="stat"><span>Ganancia</span><b class="win" id="winDisp">0.00</b></div>
    </div>

    <div class="lbl">Tipo de apuesta</div>
    <div class="seg" id="segMain">
      <button data-bet="lo" class="sel">BAJO<small>1–3 · 2x</small></button>
      <button data-bet="hi">ALTO<small>4–6 · 2x</small></button>
    </div>

    <div class="lbl">O un número exacto · 5.7x</div>
    <div class="seg nums" id="segNums">
      <button data-bet="n1">1</button>
      <button data-bet="n2">2</button>
      <button data-bet="n3">3</button>
      <button data-bet="n4">4</button>
      <button data-bet="n5">5</button>
      <button data-bet="n6">6</button>
    </div>

    <div class="controls">
      <div class="bet">
        <button id="betDown">−</button><div class="v" id="betVal">50</div><button id="betUp">+</button>
      </div>
      <button class="act" id="actBtn">TIRAR</button>
    </div>
    <div class="msg" id="message">¡Suerte con el dado!</div>
    <div class="foot">Nova Dado · juego original de BetNova · bajo/alto pagan 2x · número exacto 5.7x</div>
  </div>

<script src="../_shared/house.js?v=20260615d"></script>
<script src="../_shared/wallet-bridge.js?v=20260615d"></script>
<script src="../_shared/juice.js?v=20260615d"></script>
<script>
(function(){
  const BETS=[50,100,250,500,1000]; let betIdx=0;
  const PAYOUT = { lo: 2, hi: 2, exact: 5.7 };
  let balance=1000, rolling=false, betType='lo';
  const $=(id)=>document.getElementById(id);
  const fmt=(n)=>n.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2});
  const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));

  // payout multiplier for the chosen bet (used for house gate + win pay)
  function payout(type){
    if(type==='lo') return PAYOUT.lo;
    if(type==='hi') return PAYOUT.hi;
    return PAYOUT.exact; // n1..n6
  }

  // ---- dice SVG (white rounded die with pips 1..6) ----
  function diceSVG(n){
    const P={1:[[50,50]],2:[[30,30],[70,70]],3:[[28,28],[50,50],[72,72]],
      4:[[30,30],[70,30],[30,70],[70,70]],5:[[30,30],[70,30],[50,50],[30,70],[70,70]],
      6:[[30,28],[70,28],[30,50],[70,50],[30,72],[70,72]]};
    const pips=(P[n]||[]).map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="8" fill="#0a0e1a"/>`).join('');
    return `<svg class="die" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <rect x="6" y="6" width="88" height="88" rx="18" fill="#f4f8ff"/>
      <rect x="6" y="6" width="88" height="88" rx="18" fill="none" stroke="rgba(0,0,0,.12)" stroke-width="2"/>
      ${pips}</svg>`;
  }

  function renderDie(n, spin){
    $('dice').innerHTML = diceSVG(n);
    if(spin){ Array.from($('dice').children).forEach(e=>e.classList.add('spin')); }
  }

  // ---- audio: subtle dice-roll synth (no win/bet sounds; shared handles those) ----
  let actx=null; const ac=()=>{ if(!actx){try{actx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}} if(actx&&actx.state==='suspended')actx.resume(); return actx; };
  function clack(){ const c=ac(); if(!c)return; const o=c.createOscillator(),g=c.createGain();
    o.type='triangle'; o.frequency.setValueAtTime(120+Math.random()*180,c.currentTime);
    g.gain.setValueAtTime(0.08,c.currentTime); g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+0.07);
    o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+0.08); }

  // ---- evaluate a single die against the chosen bet → win? ----
  function isWin(type, d){
    if(type==='lo') return d>=1 && d<=3;
    if(type==='hi') return d>=4 && d<=6;
    if(type[0]==='n') return d === +type.slice(1);
    return false;
  }

  // ---- pick a die value that WINS or LOSES the chosen bet ----
  function genDie(type, mustWin){
    let winning, losing;
    if(type==='lo'){ winning=[1,2,3]; losing=[4,5,6]; }
    else if(type==='hi'){ winning=[4,5,6]; losing=[1,2,3]; }
    else { const t=+type.slice(1); winning=[t]; losing=[1,2,3,4,5,6].filter(x=>x!==t); }
    const pool = mustWin ? winning : losing;
    return pool[ri(0,pool.length-1)];
  }

  function syncUI(){
    $('balance').textContent=fmt(balance);
    $('betDisp').textContent=fmt(BETS[betIdx]);
    $('betVal').textContent=BETS[betIdx];
    $('actBtn').disabled=rolling;
  }
  function setMsg(t){ $('message').textContent=t; }

  function selectBet(type){
    if(rolling) return;
    betType=type;
    Array.from(document.querySelectorAll('.seg button')).forEach(b=>{
      b.classList.toggle('sel', b.getAttribute('data-bet')===type);
    });
  }

  function resolve(d){
    const won=isWin(betType,d);
    const bet=BETS[betIdx];
    const pm=payout(betType);
    $('sum').innerHTML = `Salió: <b>${d}</b>`;
    if(won){
      const win=bet*pm;
      balance=NovaWallet.win(win);
      $('winDisp').textContent=fmt(win);
      setMsg(`✅ ¡Ganaste! ${pm}x · +${fmt(win)}`);
      if(window.Juice) Juice.win(win,{ mult:pm, el:$('winDisp') });
    }else{
      $('winDisp').textContent=fmt(0);
      setMsg('❌ No esta vez. ¡Vuelve a tirar!');
    }
    rolling=false;          // reset BEFORE syncUI
    syncUI();
  }

  function roll(){
    if(rolling) return;
    const bet=BETS[betIdx];
    if(balance<bet){ setMsg('Saldo insuficiente.'); return; }
    balance=NovaWallet.bet(bet);
    rolling=true;
    $('winDisp').textContent=fmt(0);
    setMsg('Rodando el dado…');
    syncUI();

    // house gate: decide if the chosen bet should win this round
    const payoutMult=payout(betType);
    const canWin = (window.NovaHouse ? NovaHouse.allowWin(payoutMult) : true);
    const finalDie = genDie(betType, canWin);

    // quick tumble animation
    let ticks=0;
    renderDie(ri(1,6), true);
    clack();
    const iv=setInterval(()=>{
      ticks++;
      renderDie(ri(1,6), true);
      if(ticks%2===0) clack();
      if(ticks>=8){
        clearInterval(iv);
        renderDie(finalDie, false);
        resolve(finalDie);
      }
    },90);
  }

  // ---- wiring ----
  $('segMain').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b){ ac(); selectBet(b.getAttribute('data-bet')); } });
  $('segNums').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b){ ac(); selectBet(b.getAttribute('data-bet')); } });
  $('actBtn').addEventListener('click',()=>{ ac(); roll(); });
  $('betUp').addEventListener('click',()=>{ if(!rolling&&betIdx<BETS.length-1){betIdx++;syncUI();} });
  $('betDown').addEventListener('click',()=>{ if(!rolling&&betIdx>0){betIdx--;syncUI();} });

  // initial render
  renderDie(1, false);
  syncUI();

  // NovaWallet hooks at the VERY END (after $ and all funcs are defined → no TDZ)
  NovaWallet.ready(b=>{ balance=b; syncUI(); });
  NovaWallet.onBalance(b=>{ balance=b; syncUI(); });
})();
</script>
</body>
</html>
