<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Nova Dragon Tiger — BetNova</title>
<link rel="stylesheet" href="../_shared/juice.css" />
<style>
  :root{ --brand:#19e57f; --ink:#0a0e1a; --panel:#121829; --panel2:#1a2238; --gold:#ffc83d; --muted:#8a94ad; --red:#ff4d5e; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{ font-family:"Segoe UI",system-ui,Roboto,sans-serif; color:#e8eefc;
    background:radial-gradient(circle at 50% -10%, #163a55, var(--ink) 60%);
    min-height:100%; padding:10px; user-select:none; -webkit-user-select:none; }
  .wrap{ max-width:360px; margin:0 auto; }
  .head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .head h1{ font-size:19px; font-weight:800; } .head h1 span{ color:var(--brand); }
  .head .tag{ font-size:10px; color:var(--muted); background:rgba(255,255,255,.06); padding:4px 9px; border-radius:999px; }
  .stage{ position:relative; border-radius:16px; border:1px solid rgba(255,255,255,.08);
    background:#0a1120; box-shadow:0 14px 40px rgba(0,0,0,.5); padding:12px 10px;
    display:flex; flex-direction:column; align-items:center; gap:8px; }
  .duel{ display:flex; align-items:center; justify-content:center; gap:14px; width:100%; }
  .seat{ display:flex; flex-direction:column; align-items:center; gap:5px; }
  .seat .who{ font-size:11px; font-weight:800; letter-spacing:.5px; text-transform:uppercase; }
  .seat.dragon .who{ color:#5b8cff; }
  .seat.tiger .who{ color:#ff8a3d; }
  .seat.dragon.win .cardface{ box-shadow:0 0 18px rgba(91,140,255,.7); }
  .seat.tiger.win .cardface{ box-shadow:0 0 18px rgba(255,138,61,.7); }
  .vs{ font-size:16px; font-weight:800; color:var(--red); }
  .cardholder{ perspective:700px; }
  .card{ width:104px; height:144px; border-radius:13px; position:relative;
    transition:transform .28s ease; transform-style:preserve-3d; }
  .card.flip{ animation:flip .42s ease; }
  @keyframes flip{ 0%{ transform:rotateY(0) scale(1);} 45%{ transform:rotateY(90deg) scale(1.04);} 55%{ transform:rotateY(90deg) scale(1.04);} 100%{ transform:rotateY(0) scale(1);} }
  .cardface{ width:100%; height:100%; border-radius:13px; background:#f6f8ff;
    box-shadow:0 8px 22px rgba(0,0,0,.45); position:relative; overflow:hidden; transition:box-shadow .2s; }
  .cardface.back{ background:linear-gradient(135deg,#1a2238,#0e1424);
    border:1px solid rgba(255,255,255,.08); }
  .cardface.back::after{ content:""; position:absolute; inset:8px; border-radius:8px;
    border:2px solid rgba(25,229,127,.35); background:
      repeating-linear-gradient(45deg, rgba(25,229,127,.10) 0 6px, transparent 6px 12px); }
  .cardface .corner{ position:absolute; font-weight:800; line-height:1; text-align:center; }
  .cardface .corner.tl{ top:7px; left:8px; }
  .cardface .corner.br{ bottom:7px; right:8px; transform:rotate(180deg); }
  .cardface .corner .r{ font-size:19px; }
  .cardface .corner svg{ width:13px; height:13px; display:block; margin:2px auto 0; }
  .cardface .center{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); }
  .cardface .center svg{ width:50px; height:50px; }
  .picks{ display:flex; gap:6px; width:100%; margin-top:2px; }
  .pbtn{ flex:1; height:50px; border:2px solid transparent; border-radius:11px; cursor:pointer;
    font-weight:800; color:#e8eefc; background:var(--panel2); transition:.15s; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; }
  .pbtn small{ font-size:10px; color:var(--muted); font-weight:700; }
  .pbtn.dragon.sel{ border-color:#5b8cff; box-shadow:0 0 14px rgba(91,140,255,.4); }
  .pbtn.tie.sel{ border-color:var(--gold); box-shadow:0 0 14px rgba(255,200,61,.4); }
  .pbtn.tiger.sel{ border-color:#ff8a3d; box-shadow:0 0 14px rgba(255,138,61,.4); }
  .pbtn:disabled{ opacity:.5; cursor:not-allowed; }
  .hud{ display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-top:10px; }
  .stat{ background:var(--panel); border:1px solid rgba(255,255,255,.07); border-radius:10px; padding:7px; text-align:center; }
  .stat span{ display:block; font-size:9px; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; }
  .stat b{ font-size:16px; } .stat b.bal{ color:var(--brand);} .stat b.win{ color:var(--gold);}
  .controls{ display:flex; gap:9px; margin-top:10px; }
  .bet{ display:flex; align-items:center; gap:6px; background:var(--panel); border:1px solid rgba(255,255,255,.07); border-radius:12px; padding:7px 9px; }
  .bet button{ width:30px; height:30px; border-radius:8px; border:0; background:var(--panel2); color:#fff; font-size:18px; cursor:pointer; }
  .bet .v{ min-width:46px; text-align:center; font-weight:700; }
  .act{ flex:1; height:46px; border:0; border-radius:13px; cursor:pointer; font-size:16px; font-weight:800; color:var(--ink); background:linear-gradient(180deg,var(--gold),#e0a90c); box-shadow:0 0 20px rgba(255,200,61,.35); transition:filter .15s; }
  .act:disabled{ opacity:.5; cursor:not-allowed; box-shadow:none; }
  .msg{ text-align:center; min-height:18px; margin-top:8px; font-weight:700; color:var(--gold); font-size:12px; }
  .foot{ margin-top:6px; text-align:center; font-size:9px; color:#5e6781; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="head"><h1>Nova <span>Dragon Tiger</span></h1><span class="tag">Desarrollado por BetNova</span></div>
    <div class="stage">
      <div class="duel">
        <div class="seat dragon" id="dragonSeat">
          <div class="who">Dragón</div>
          <div class="cardholder"><div class="card" id="cardDragon"><div class="cardface back" id="faceDragon"></div></div></div>
        </div>
        <div class="vs">VS</div>
        <div class="seat tiger" id="tigerSeat">
          <div class="who">Tigre</div>
          <div class="cardholder"><div class="card" id="cardTiger"><div class="cardface back" id="faceTiger"></div></div></div>
        </div>
      </div>
      <div class="picks">
        <button class="pbtn dragon" id="pickDragon">DRAGÓN<small>paga 2x</small></button>
        <button class="pbtn tie" id="pickTie">EMPATE<small>paga 9x</small></button>
        <button class="pbtn tiger" id="pickTiger">TIGRE<small>paga 2x</small></button>
      </div>
    </div>
    <div class="hud">
      <div class="stat"><span>Saldo</span><b class="bal" id="balance">1000.00</b></div>
      <div class="stat"><span>Apuesta</span><b id="betDisp">50.00</b></div>
      <div class="stat"><span>Ganancia</span><b class="win" id="winDisp">0.00</b></div>
    </div>
    <div class="controls">
      <div class="bet">
        <button id="betDown">−</button><div class="v" id="betVal">50</div><button id="betUp">+</button>
      </div>
      <button class="act" id="actBtn">REPARTIR</button>
    </div>
    <div class="msg" id="message">Elige Dragón, Tigre o Empate 🃏</div>
    <div class="foot">Nova Dragon Tiger · juego original de BetNova · la carta más alta gana · Empate paga 9x</div>
  </div>
<script src="../_shared/house.js?v=20260615d"></script>
<script src="../_shared/wallet-bridge.js?v=20260615d"></script>
<script src="../_shared/juice.js?v=20260615d"></script>
<script>
(function(){
  const $=(id)=>document.getElementById(id);
  const fmt=(n)=>n.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2});
  const BETS=[50,100,250,500,1000]; let betIdx=0;
  let balance=1000;
  let playing=false;
  let pick='dragon'; // 'dragon' | 'tiger' | 'tie'

  const PAYOUT={ dragon:2, tiger:2, tie:9 };

  // Ranks: A=1 low ... K=13 high. Higher card wins; equal rank = Empate.
  const SUITS=['S','H','D','C'];
  const rankLabel=(r)=> r===1 ? 'A' : (r<=10 ? String(r) : ({11:'J',12:'Q',13:'K'})[r]);
  const randSuit=()=>SUITS[(Math.random()*4)|0];

  // --- inline SVG suits (no emojis) ---
  function suitSVG(s,size){
    const red=(s==='H'||s==='D');
    const col=red?'#e3304a':'#11151f';
    const w=size||50;
    let path='';
    if(s==='S') path='<path d="M50 8 C30 30 12 42 12 60 a16 16 0 0 0 30 8 C40 78 34 86 28 92 l44 0 C66 86 60 78 58 76 a16 16 0 0 0 30 -8 C88 42 70 30 50 8 Z"/>';
    else if(s==='H') path='<path d="M50 88 C18 64 10 48 10 34 A22 22 0 0 1 50 24 A22 22 0 0 1 90 34 C90 48 82 64 50 88 Z"/>';
    else if(s==='D') path='<path d="M50 8 L86 50 L50 92 L14 50 Z"/>';
    else path='<path d="M50 14 a15 15 0 1 1 -0.1 0 M30 44 a15 15 0 1 1 -0.1 0 M70 44 a15 15 0 1 1 -0.1 0 M44 60 l12 0 l4 28 l-20 0 Z"/>';
    return `<svg viewBox="0 0 100 100" width="${w}" height="${w}" fill="${col}" xmlns="http://www.w3.org/2000/svg">${path}</svg>`;
  }

  function renderCard(faceId, rank, suit){
    const red=(suit==='H'||suit==='D');
    const col=red?'#e3304a':'#11151f';
    const lbl=rankLabel(rank);
    const face=$(faceId);
    face.classList.remove('back');
    face.innerHTML =
      `<div class="corner tl" style="color:${col}"><div class="r">${lbl}</div>${suitSVG(suit,13)}</div>`+
      `<div class="center">${suitSVG(suit,50)}</div>`+
      `<div class="corner br" style="color:${col}"><div class="r">${lbl}</div>${suitSVG(suit,13)}</div>`;
  }

  function flipCard(cardId, faceId, rank, suit){
    const card=$(cardId);
    card.classList.remove('flip'); void card.offsetWidth; card.classList.add('flip');
    setTimeout(()=>renderCard(faceId, rank, suit), 200);  // swap face at mid-flip
  }

  // --- audio: subtle card-flip synth only (win/bet handled by shared system) ---
  let actx=null;
  const ac=()=>{ if(!actx){try{actx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}} if(actx&&actx.state==='suspended')actx.resume(); return actx; };
  function tone(f,d,t,v,glide){ const c=ac(); if(!c)return; const o=c.createOscillator(),g=c.createGain(); o.type=t||'sine'; o.frequency.setValueAtTime(f,c.currentTime); if(glide)o.frequency.exponentialRampToValueAtTime(glide,c.currentTime+d); g.gain.setValueAtTime(0.0001,c.currentTime); g.gain.exponentialRampToValueAtTime(v||0.12,c.currentTime+0.02); g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+d); o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d+0.02); }
  const sndFlip=()=>tone(420,0.09,'triangle',0.08,260);

  // Pick two ranks (1..13) consistent with the desired outcome:
  // 'dragon' -> dragon > tiger ; 'tiger' -> tiger > dragon ; 'tie' -> equal rank
  function dealRanks(outcome){
    let dragon, tiger;
    if(outcome==='tie'){
      dragon = 1 + ((Math.random()*13)|0); // 1..13
      tiger = dragon;
    } else if(outcome==='dragon'){
      tiger = 1 + ((Math.random()*12)|0);          // 1..12 (leave room above)
      dragon = tiger + 1 + ((Math.random()*(13-tiger))|0); // tiger+1 .. 13
    } else { // tiger
      dragon = 1 + ((Math.random()*12)|0);         // 1..12
      tiger = dragon + 1 + ((Math.random()*(13-dragon))|0); // dragon+1 .. 13
    }
    return { dragon, tiger };
  }

  function syncUI(){
    $('balance').textContent=fmt(balance);
    $('betDisp').textContent=fmt(BETS[betIdx]);
    $('betVal').textContent=BETS[betIdx];
    $('pickDragon').classList.toggle('sel', pick==='dragon');
    $('pickTiger').classList.toggle('sel', pick==='tiger');
    $('pickTie').classList.toggle('sel', pick==='tie');
    if(playing){
      $('actBtn').textContent='REPARTIENDO…';
      $('actBtn').disabled=true;
      $('pickDragon').disabled=true; $('pickTiger').disabled=true; $('pickTie').disabled=true;
      $('betUp').disabled=true; $('betDown').disabled=true;
    } else {
      $('actBtn').textContent='REPARTIR'; $('actBtn').disabled=false;
      $('pickDragon').disabled=false; $('pickTiger').disabled=false; $('pickTie').disabled=false;
      $('betUp').disabled=false; $('betDown').disabled=false;
    }
  }
  const setMsg=(t)=>{ $('message').textContent=t; };

  function deal(){
    if(playing) return;
    const bet=BETS[betIdx];
    if(balance<bet){ setMsg('Saldo insuficiente.'); return; }
    balance=NovaWallet.bet(bet);
    playing=true;
    $('winDisp').textContent=fmt(0);
    $('dragonSeat').classList.remove('win'); $('tigerSeat').classList.remove('win');
    syncUI();

    const payoutMult=PAYOUT[pick];
    const canWin=(window.NovaHouse ? NovaHouse.allowWin(payoutMult) : true);

    // Decide the round outcome consistent with the chosen bet + house gate.
    let outcome;
    if(canWin){
      outcome=pick; // chosen bet wins
    } else {
      // chosen bet loses: force a different outcome
      if(pick==='tie'){ outcome=Math.random()<0.5?'dragon':'tiger'; }
      else { outcome=Math.random()<0.85?(pick==='dragon'?'tiger':'dragon'):'tie'; }
    }

    const { dragon, tiger } = dealRanks(outcome);
    const dragonSuit=randSuit(), tigerSuit=randSuit();

    // reset both faces to back, then flip
    $('faceDragon').classList.add('back'); $('faceDragon').innerHTML='';
    $('faceTiger').classList.add('back'); $('faceTiger').innerHTML='';

    flipCard('cardDragon','faceDragon', dragon, dragonSuit); sndFlip();
    setTimeout(()=>{ flipCard('cardTiger','faceTiger', tiger, tigerSuit); sndFlip(); }, 240);

    setTimeout(()=>resolve(dragon, tiger, bet), 700);
  }

  function resolve(dragon, tiger, bet){
    let result; // 'dragon' | 'tiger' | 'tie'
    if(dragon>tiger) result='dragon'; else if(tiger>dragon) result='tiger'; else result='tie';

    if(result==='dragon') $('dragonSeat').classList.add('win');
    else if(result==='tiger') $('tigerSeat').classList.add('win');

    let win=0, push=false;
    if(result===pick){
      win=bet*PAYOUT[pick];
    } else if((pick==='dragon'||pick==='tiger') && result==='tie'){
      // tie pushes Dragón/Tigre bets: return the stake
      win=bet; push=true;
    }

    const dl=rankLabel(dragon), tl=rankLabel(tiger);
    if(win>0){
      balance=NovaWallet.win(win);
      if(push){
        $('winDisp').textContent=fmt(0);
        setMsg(`🤝 Empate (D ${dl} · T ${tl}) — apuesta devuelta`);
      } else {
        $('winDisp').textContent=fmt(win);
        const payoutMult=PAYOUT[pick];
        const rl=pick==='dragon'?'DRAGÓN':pick==='tiger'?'TIGRE':'EMPATE';
        setMsg(`✅ ¡Ganó ${rl}! +${fmt(win)} (D ${dl} · T ${tl})`);
        if(window.Juice) Juice.win(win,{ mult:payoutMult, el:$('winDisp') });
      }
    } else {
      const rl=result==='dragon'?'DRAGÓN':result==='tiger'?'TIGRE':'EMPATE';
      setMsg(`❌ Salió ${rl} (D ${dl} · T ${tl}). Perdiste.`);
    }

    playing=false;   // reset BEFORE syncUI
    syncUI();
  }

  $('actBtn').addEventListener('click',()=>{ ac(); if(!playing) deal(); });
  $('pickDragon').addEventListener('click',()=>{ if(!playing){ pick='dragon'; syncUI(); } });
  $('pickTiger').addEventListener('click',()=>{ if(!playing){ pick='tiger'; syncUI(); } });
  $('pickTie').addEventListener('click',()=>{ if(!playing){ pick='tie'; syncUI(); } });
  $('betUp').addEventListener('click',()=>{ if(!playing&&betIdx<BETS.length-1){betIdx++;syncUI();} });
  $('betDown').addEventListener('click',()=>{ if(!playing&&betIdx>0){betIdx--;syncUI();} });

  // initial render BEFORE wallet hooks
  syncUI();

  // wallet hooks at the VERY END (avoid TDZ on $/consts)
  NovaWallet.ready(b=>{ balance=b; syncUI(); });
  NovaWallet.onBalance(b=>{ balance=b; syncUI(); });
})();
</script>
</body>
</html>
