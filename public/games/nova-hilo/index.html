<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Nova HiLo — BetNova</title>
<link rel="stylesheet" href="../_shared/juice.css" />
<style>
  :root{ --brand:#19e57f; --ink:#0a0e1a; --panel:#121829; --panel2:#1a2238; --gold:#ffc83d; --muted:#8a94ad; --red:#ff4d5e; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{ font-family:"Segoe UI",system-ui,Roboto,sans-serif; color:#e8eefc;
    background:radial-gradient(circle at 50% -10%, #163a55, var(--ink) 60%);
    min-height:100%; padding:12px; user-select:none; -webkit-user-select:none; }
  .wrap{ max-width:420px; margin:0 auto; }
  .head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .head h1{ font-size:20px; font-weight:800; } .head h1 span{ color:var(--brand); }
  .head .tag{ font-size:11px; color:var(--muted); background:rgba(255,255,255,.06); padding:4px 10px; border-radius:999px; }
  .stage{ position:relative; border-radius:16px; border:1px solid rgba(255,255,255,.08);
    background:#0a1120; box-shadow:0 14px 40px rgba(0,0,0,.5); padding:16px 12px;
    display:flex; flex-direction:column; align-items:center; gap:10px; }
  .mult{ font-size:26px; font-weight:800; color:var(--gold); letter-spacing:.5px; min-height:32px; }
  .cardholder{ perspective:700px; }
  .card{ width:128px; height:176px; border-radius:14px; position:relative;
    transition:transform .28s ease; transform-style:preserve-3d; }
  .card.flip{ animation:flip .42s ease; }
  @keyframes flip{ 0%{ transform:rotateY(0) scale(1);} 45%{ transform:rotateY(90deg) scale(1.04);} 55%{ transform:rotateY(90deg) scale(1.04);} 100%{ transform:rotateY(0) scale(1);} }
  .cardface{ width:100%; height:100%; border-radius:14px; background:#f6f8ff;
    box-shadow:0 8px 22px rgba(0,0,0,.45); position:relative; overflow:hidden; }
  .cardface .corner{ position:absolute; font-weight:800; line-height:1; text-align:center; }
  .cardface .corner.tl{ top:8px; left:9px; }
  .cardface .corner.br{ bottom:8px; right:9px; transform:rotate(180deg); }
  .cardface .corner .r{ font-size:22px; }
  .cardface .corner svg{ width:15px; height:15px; display:block; margin:2px auto 0; }
  .cardface .center{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); }
  .cardface .center svg{ width:58px; height:58px; }
  .odds{ display:flex; gap:10px; width:100%; }
  .odds .o{ flex:1; text-align:center; font-size:11px; color:var(--muted); }
  .odds .o b{ display:block; font-size:14px; color:#e8eefc; }
  .guess{ display:flex; gap:10px; width:100%; }
  .gbtn{ flex:1; height:48px; border:0; border-radius:12px; cursor:pointer; font-size:15px; font-weight:800; color:var(--ink);
    background:linear-gradient(180deg,var(--brand),#0fb863); box-shadow:0 0 16px rgba(25,229,127,.3); transition:filter .15s; }
  .gbtn.lo{ background:linear-gradient(180deg,#5b8cff,#2f5fd0); box-shadow:0 0 16px rgba(91,140,255,.3); }
  .gbtn:disabled{ opacity:.4; cursor:not-allowed; box-shadow:none; }
  .hud{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px; }
  .stat{ background:var(--panel); border:1px solid rgba(255,255,255,.07); border-radius:10px; padding:8px; text-align:center; }
  .stat span{ display:block; font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; }
  .stat b{ font-size:17px; } .stat b.bal{ color:var(--brand);} .stat b.win{ color:var(--gold);}
  .controls{ display:flex; gap:10px; margin-top:12px; }
  .bet{ display:flex; align-items:center; gap:6px; background:var(--panel); border:1px solid rgba(255,255,255,.07); border-radius:12px; padding:8px 10px; }
  .bet button{ width:32px; height:32px; border-radius:8px; border:0; background:var(--panel2); color:#fff; font-size:18px; cursor:pointer; }
  .bet .v{ min-width:50px; text-align:center; font-weight:700; }
  .act{ flex:1; height:48px; border:0; border-radius:13px; cursor:pointer; font-size:16px; font-weight:800; color:var(--ink); background:linear-gradient(180deg,var(--gold),#e0a90c); box-shadow:0 0 20px rgba(255,200,61,.35); transition:filter .15s; }
  .act:disabled{ opacity:.5; cursor:not-allowed; box-shadow:none; }
  .msg{ text-align:center; min-height:20px; margin-top:9px; font-weight:700; color:var(--gold); font-size:13px; }
  .foot{ margin-top:7px; text-align:center; font-size:10px; color:#5e6781; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="head"><h1>Nova <span>HiLo</span></h1><span class="tag">Desarrollado por BetNova</span></div>
    <div class="stage">
      <div class="mult" id="mult">—</div>
      <div class="cardholder"><div class="card" id="card"><div class="cardface" id="cardface"></div></div></div>
      <div class="odds">
        <div class="o">Menor<b id="oddsLo">—</b></div>
        <div class="o">Mayor<b id="oddsHi">—</b></div>
      </div>
      <div class="guess">
        <button class="gbtn lo" id="btnLo">MENOR ↓</button>
        <button class="gbtn" id="btnHi">MAYOR ↑</button>
      </div>
    </div>
    <div class="hud">
      <div class="stat"><span>Saldo</span><b class="bal" id="balance">1000.00</b></div>
      <div class="stat"><span>Apuesta</span><b id="betDisp">50.00</b></div>
      <div class="stat"><span>Ganancia</span><b class="win" id="winDisp">0.00</b></div>
    </div>
    <div class="controls">
      <div class="bet">
        <button id="betDown">−</button><div class="v" id="betVal">50</div><button id="betUp">+</button>
      </div>
      <button class="act" id="actBtn">JUGAR</button>
    </div>
    <div class="msg" id="message">Pon tu apuesta y pulsa JUGAR 🃏</div>
    <div class="foot">Nova HiLo · juego original de BetNova · adivina mayor o menor</div>
  </div>
<script src="../_shared/house.js"></script>
<script src="../_shared/wallet-bridge.js"></script>
<script src="../_shared/juice.js"></script>
<script>
(function(){
  const $=(id)=>document.getElementById(id);
  const fmt=(n)=>n.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2});
  const BETS=[50,100,250,500,1000]; let betIdx=0;
  const HOUSE_CUT=0.97;            // 3% house cut on each correct guess
  let balance=1000;
  let playing=false, current=14, mult=1;

  // Ranks 2..14; A=14 K=13 Q=12 J=11. Suits just for looks.
  const SUITS=['S','H','D','C'];
  const rankLabel=(r)=> r<=10 ? String(r) : ({11:'J',12:'Q',13:'K',14:'A'})[r];

  // --- inline SVG suits (no emojis) ---
  function suitSVG(s,size){
    const red = (s==='H'||s==='D');
    const col = red ? '#e3304a' : '#11151f';
    const w = size||58;
    let path='';
    if(s==='S') path='<path d="M50 8 C30 30 12 42 12 60 a16 16 0 0 0 30 8 C40 78 34 86 28 92 l44 0 C66 86 60 78 58 76 a16 16 0 0 0 30 -8 C88 42 70 30 50 8 Z"/>';
    else if(s==='H') path='<path d="M50 88 C18 64 10 48 10 34 A22 22 0 0 1 50 24 A22 22 0 0 1 90 34 C90 48 82 64 50 88 Z"/>';
    else if(s==='D') path='<path d="M50 8 L86 50 L50 92 L14 50 Z"/>';
    else path='<path d="M50 14 a15 15 0 1 1 -0.1 0 M30 44 a15 15 0 1 1 -0.1 0 M70 44 a15 15 0 1 1 -0.1 0 M44 60 l12 0 l4 28 l-20 0 Z"/>';
    return `<svg viewBox="0 0 100 100" width="${w}" height="${w}" fill="${col}" xmlns="http://www.w3.org/2000/svg">${path}</svg>`;
  }

  function renderCard(rank, suit){
    const red = (suit==='H'||suit==='D');
    const col = red ? '#e3304a' : '#11151f';
    const lbl = rankLabel(rank);
    $('cardface').innerHTML =
      `<div class="corner tl" style="color:${col}"><div class="r">${lbl}</div>${suitSVG(suit,15)}</div>`+
      `<div class="center">${suitSVG(suit,58)}</div>`+
      `<div class="corner br" style="color:${col}"><div class="r">${lbl}</div>${suitSVG(suit,15)}</div>`;
  }
  function flipTo(rank){
    const suit=SUITS[(Math.random()*4)|0];
    const card=$('card');
    card.classList.remove('flip'); void card.offsetWidth; card.classList.add('flip');
    setTimeout(()=>renderCard(rank,suit), 200);  // swap face at mid-flip
  }

  // --- audio ---
  let actx=null;
  const ac=()=>{ if(!actx){try{actx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}} if(actx&&actx.state==='suspended')actx.resume(); return actx; };
  function tone(f,d,t,v,glide){ const c=ac(); if(!c)return; const o=c.createOscillator(),g=c.createGain(); o.type=t||'sine'; o.frequency.setValueAtTime(f,c.currentTime); if(glide)o.frequency.exponentialRampToValueAtTime(glide,c.currentTime+d); g.gain.setValueAtTime(0.0001,c.currentTime); g.gain.exponentialRampToValueAtTime(v||0.12,c.currentTime+0.02); g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+d); o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d+0.02); }
  const sndFlip=()=>tone(420,0.09,'triangle',0.09,260);
  const sndWin =()=>{ [660,880,1175].forEach((f,i)=>setTimeout(()=>tone(f,0.18,'triangle',0.12),i*70)); };
  const sndLose=()=>tone(200,0.45,'sawtooth',0.14,70);

  // --- probabilities over ranks 2..14 (13 ranks) ---
  const TOTAL=13;
  const higherCount=(r)=> 14 - r;          // ranks strictly higher than r
  const lowerCount =(r)=> r - 2;           // ranks strictly lower than r
  // payout factor for a guess given how many ranks make it win
  const factor=(winRanks)=> winRanks>0 ? (HOUSE_CUT * TOTAL / winRanks) : 0;

  function syncUI(){
    $('balance').textContent=fmt(balance);
    $('betDisp').textContent=fmt(BETS[betIdx]);
    $('betVal').textContent=BETS[betIdx];
    if(playing){
      $('mult').textContent=mult.toFixed(2)+'x';
      const hi=higherCount(current), lo=lowerCount(current);
      $('oddsHi').textContent = hi>0 ? factor(hi).toFixed(2)+'x' : '—';
      $('oddsLo').textContent = lo>0 ? factor(lo).toFixed(2)+'x' : '—';
      $('btnHi').disabled = hi<=0;   // can't go higher than A
      $('btnLo').disabled = lo<=0;   // can't go lower than 2
      $('actBtn').textContent='RETIRAR';
      $('actBtn').disabled=false;
      $('betUp').disabled=true; $('betDown').disabled=true;
    } else {
      $('oddsHi').textContent='—'; $('oddsLo').textContent='—';
      $('btnHi').disabled=true; $('btnLo').disabled=true;
      $('actBtn').textContent='JUGAR'; $('actBtn').disabled=false;
      $('betUp').disabled=false; $('betDown').disabled=false;
    }
  }
  const setMsg=(t)=>{ $('message').textContent=t; };

  function start(){
    if(playing) return;
    const bet=BETS[betIdx];
    if(balance<bet){ setMsg('Saldo insuficiente.'); return; }
    balance=NovaWallet.bet(bet);
    current=2+((Math.random()*TOTAL)|0);
    mult=1;
    playing=true;
    $('winDisp').textContent=fmt(0);
    renderCard(current, SUITS[(Math.random()*4)|0]);
    flipTo(current); sndFlip();
    setMsg('¿La siguiente será MAYOR o MENOR?');
    syncUI();
  }

  // guess: 'hi' or 'lo'
  function guess(dir){
    if(!playing) return;
    const winRanks = dir==='hi' ? higherCount(current) : lowerCount(current);
    if(winRanks<=0) return;                 // impossible guess, ignore
    const nextMult = mult * factor(winRanks);
    const canWin = (window.NovaHouse ? NovaHouse.allowWin(nextMult) : true);

    let next;
    if(canWin){
      // pick a rank that makes this guess CORRECT
      if(dir==='hi') next = current + 1 + ((Math.random()*winRanks)|0);   // current+1 .. 14
      else           next = 2 + ((Math.random()*winRanks)|0);             // 2 .. current-1
    } else {
      // pick a rank that makes this guess WRONG (ties count as wrong)
      const loseRanks = TOTAL - winRanks;   // includes the tie (equal rank) + opposite side
      let k = (Math.random()*loseRanks)|0;
      if(dir==='hi'){
        // wrong = ranks <= current  (2..current), there are current-2+1 = current-1
        next = 2 + k;                       // 2 .. current
        if(next>current) next=current;
      } else {
        // wrong = ranks >= current  (current..14)
        next = current + k;                 // current .. 14
        if(next>14) next=14;
      }
    }
    if(next<2) next=2; if(next>14) next=14;

    flipTo(next); sndFlip();
    const revealed=next;

    setTimeout(()=>{
      const correct = dir==='hi' ? (revealed>current) : (revealed<current);
      current=revealed;
      if(correct){
        mult=nextMult;
        sndWin();
        setMsg(`¡Acierto! Multiplicador ${mult.toFixed(2)}x · sigue o RETIRA`);
        syncUI();
      } else {
        playing=false;
        sndLose();
        setMsg(`❌ Salió ${rankLabel(revealed)}. Perdiste la apuesta.`);
        $('mult').textContent='0.00x';
        syncUI();
      }
    }, 230);
  }

  function cashOut(){
    if(!playing) return;
    const win=BETS[betIdx]*mult;
    balance=NovaWallet.win(win);
    $('winDisp').textContent=fmt(win);
    sndWin();
    setMsg(`✅ Retiraste en ${mult.toFixed(2)}x · +${fmt(win)}`);
    if(window.Juice) Juice.win(win,{ mult, el:$('winDisp') });
    playing=false;          // reset BEFORE syncUI
    syncUI();
  }

  $('actBtn').addEventListener('click',()=>{ ac(); if(playing) cashOut(); else start(); });
  $('btnHi').addEventListener('click',()=>{ ac(); guess('hi'); });
  $('btnLo').addEventListener('click',()=>{ ac(); guess('lo'); });
  $('betUp').addEventListener('click',()=>{ if(!playing&&betIdx<BETS.length-1){betIdx++;syncUI();} });
  $('betDown').addEventListener('click',()=>{ if(!playing&&betIdx>0){betIdx--;syncUI();} });

  // initial render BEFORE wallet hooks
  syncUI();

  // wallet hooks at the VERY END (avoid TDZ on $/consts)
  NovaWallet.ready(b=>{ balance=b; syncUI(); });
  NovaWallet.onBalance(b=>{ balance=b; syncUI(); });
})();
</script>
</body>
</html>
