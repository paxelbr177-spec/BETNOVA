    <linearGradient id="jg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c79bff"/><stop offset="1" stop-color="#7a30e0"/></linearGradient>
  </defs>
  <rect width="300" height="400" fill="url(#bg)"/>
  <text x="40" y="80" font-size="60" fill="#ffc83d" opacity=".12">♠</text>
