    <g transform="rotate(16) translate(54,0)"><rect x="-34" y="-50" width="68" height="100" rx="9" fill="#fff" stroke="#b87e0a" stroke-width="2"/><text x="0" y="6" font-family="'Arial Black',sans-serif" font-size="34" font-weight="900" fill="#1a2330" text-anchor="middle">K</text><text x="0" y="34" font-size="22" fill="#1a2330" text-anchor="middle">♠</text></g>
