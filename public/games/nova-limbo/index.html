<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Nova Limbo — BetNova</title>
<link rel="stylesheet" href="../_shared/juice.css" />
<style>
  :root{ --ink:#0a0e1a; --panel:#121829; --panel2:#1a2238; --brand:#19e57f; --gold:#ffc83d; --muted:#8a94ad; --red:#ff4d5e; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{ font-family:"Segoe UI",system-ui,Roboto,sans-serif; color:#e8eefc;
    background:radial-gradient(circle at 50% -10%, #163a55, var(--ink) 60%); min-height:100%; padding:14px; user-select:none; }
  .wrap{ max-width:560px; margin:0 auto; }
  .head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .head h1{ font-size:20px; font-weight:800; } .head h1 span{ color:var(--brand); }
  .head .tag{ font-size:11px; color:var(--muted); background:rgba(255,255,255,.06); padding:4px 10px; border-radius:999px; }
  .card{ background:var(--panel); border:1px solid rgba(255,255,255,.07); border-radius:16px; padding:26px 18px; text-align:center; }
  .result{ font-size:clamp(48px,16vw,84px); font-weight:800; letter-spacing:1px; transition:color .2s; }
  .result.win{ color:var(--brand); text-shadow:0 0 30px rgba(25,229,127,.5); }
  .result.lose{ color:var(--red); } .result.idle{ color:#e8eefc; }
  .sub{ color:var(--muted); font-size:13px; margin-top:4px; min-height:18px; }
  .targetRow{ display:flex; align-items:center; gap:10px; margin-top:18px; }
  .targetRow label{ font-size:12px; color:var(--muted); white-space:nowrap; }
  .targetRow input{ flex:1; background:var(--panel2); border:1px solid rgba(255,255,255,.1); border-radius:10px; padding:12px; color:#fff; font-size:18px; font-weight:700; text-align:center; outline:none; }
  .targetRow input:focus{ border-color:var(--brand); }
  .info{ display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-top:14px; }
  .info .b{ background:var(--panel2); border-radius:10px; padding:9px; text-align:center; }
  .info .b span{ display:block; font-size:10px; color:var(--muted); text-transform:uppercase; }
  .info .b b{ font-size:16px; }
  .hud{ display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-top:14px; }
  .stat{ background:var(--panel); border:1px solid rgba(255,255,255,.07); border-radius:10px; padding:9px; text-align:center; }
  .stat span{ display:block; font-size:10px; color:var(--muted); text-transform:uppercase; }
  .stat b{ font-size:18px; } .stat b.bal{ color:var(--brand);} .stat b.win{ color:var(--gold);}
  .controls{ display:flex; gap:10px; margin-top:14px; }
  .bet{ display:flex; align-items:center; gap:6px; background:var(--panel); border:1px solid rgba(255,255,255,.07); border-radius:12px; padding:8px 10px; }
  .bet button{ width:32px; height:32px; border-radius:8px; border:0; background:var(--panel2); color:#fff; font-size:18px; cursor:pointer; }
  .bet .v{ min-width:54px; text-align:center; font-weight:700; }
  .act{ flex:1; height:50px; border:0; border-radius:13px; cursor:pointer; font-size:17px; font-weight:800; color:var(--ink); background:linear-gradient(180deg,var(--brand),#0fb863); box-shadow:0 0 22px rgba(25,229,127,.4); }
  .act:disabled{ opacity:.5; cursor:not-allowed; box-shadow:none; }
  .msg{ text-align:center; min-height:22px; margin-top:10px; font-weight:700; color:var(--gold); }
  .foot{ margin-top:8px; text-align:center; font-size:10px; color:#5e6781; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="head"><h1>Nova <span>Limbo</span></h1><span class="tag">Desarrollado por BetNova</span></div>
    <div class="card">
      <div class="result idle" id="result">1.00x</div>
      <div class="sub" id="sub">Supera tu objetivo para ganar</div>
      <div class="targetRow">
        <label>Objetivo ≥</label>
        <input id="target" type="number" inputmode="decimal" min="1.01" max="1000" step="0.01" value="2.00" />
      </div>
      <div class="info">
        <div class="b"><span>Prob. ganar</span><b id="chance">49.50%</b></div>
        <div class="b"><span>Pago</span><b id="payout">0.00</b></div>
      </div>
    </div>
    <div class="hud">
      <div class="stat"><span>Saldo</span><b class="bal" id="balance">1000.00</b></div>
      <div class="stat"><span>Ganancia</span><b class="win" id="winDisp">0.00</b></div>
    </div>
    <div class="controls">
      <div class="bet"><button id="betDown">−</button><div class="v" id="betVal">10</div><button id="betUp">+</button></div>
      <button class="act" id="rollBtn">APOSTAR</button>
    </div>
    <div class="msg" id="message">Elige objetivo y apuesta 🚀</div>
    <div class="foot">Nova Limbo · juego original de BetNova · casa 1% · gana si el multiplicador supera tu objetivo</div>
  </div>
<script src="../_shared/house.js"></script>
<script src="../_shared/wallet-bridge.js"></script>
<script src="../_shared/juice.js"></script>
<script>
(function(){
  const BETS=[5,10,25,50,100]; let betIdx=1;
  let balance=1000, rolling=false;
  const $=(id)=>document.getElementById(id);
  const fmt=(n)=>n.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2});

  let actx=null; const ac=()=>{ if(!actx){try{actx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}} if(actx&&actx.state==='suspended')actx.resume(); return actx; };
  function tone(f,d,t,v,glide){ const c=ac(); if(!c)return; const o=c.createOscillator(),g=c.createGain(); o.type=t||'sine'; o.frequency.setValueAtTime(f,c.currentTime); if(glide)o.frequency.exponentialRampToValueAtTime(glide,c.currentTime+d); g.gain.setValueAtTime(0.0001,c.currentTime); g.gain.exponentialRampToValueAtTime(v||0.12,c.currentTime+0.02); g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+d); o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d+0.02); }
  const sndRoll=()=>tone(300,0.4,'sawtooth',0.05,1200);
  const sndWin=(big)=>{ (big?[523,659,784,1047]:[523,784]).forEach((f,i)=>setTimeout(()=>tone(f,0.16,'triangle',0.12),i*80)); };
  const sndLose=()=>tone(320,0.3,'sine',0.08,160);

  NovaWallet.ready(b=>{ balance=b; syncUI(); });
  NovaWallet.onBalance(b=>{ balance=b; syncUI(); });

  const target=()=>Math.max(1.01, Math.min(1000, parseFloat($('target').value)||1.01));
  const chance=()=>99/target();   // % aprox (casa 1%)

  function syncUI(){
    $('balance').textContent=fmt(balance);
    $('betVal').textContent=BETS[betIdx];
    $('chance').textContent=chance().toFixed(2)+'%';
    $('payout').textContent=fmt(BETS[betIdx]*target());
  }
  const setMsg=(t)=>$('message').textContent=t;

  function roll(){
    if(rolling)return; const bet=BETS[betIdx], tg=target();
    if(balance<bet){ setMsg('Saldo insuficiente.'); return; }
    balance=NovaWallet.bet(bet); rolling=true; $('rollBtn').disabled=true; syncUI(); setMsg('🚀 Subiendo…'); sndRoll();
    // multiplicador aleatorio justo (misma distribución que crash, casa 1%)
    const canWin = (window.NovaHouse ? NovaHouse.allowWin() : true);
    let res;
    if(canWin){
      // resultado >= objetivo (gana)
      res = Math.floor((tg + Math.random()*tg)*100)/100;
    } else {
      // resultado en [1, objetivo) (pierde)
      res = Math.floor((1 + Math.random()*(tg-1))*100)/100;
    }
    res = Math.max(1, res);
    // animación: el número sube de 1.00 al resultado
    const t0=performance.now(), dur=900;
    $('result').className='result idle';
    function step(now){
      const k=Math.min(1,(now-t0)/dur);
      const shown=1+(res-1)*(1-Math.pow(1-k,3));
      $('result').textContent=shown.toFixed(2)+'x';
      if(k<1){ requestAnimationFrame(step); } else { finish(res,tg,bet); }
    }
    requestAnimationFrame(step);
  }

  function finish(res,tg,bet){
    const won = res>=tg;
    $('result').textContent=res.toFixed(2)+'x';
    if(won){ const win=bet*tg; balance=NovaWallet.win(win); $('winDisp').textContent=fmt(win); $('result').className='result win';
      setMsg(`✅ ${res.toFixed(2)}x ≥ ${tg.toFixed(2)}x · ¡Ganaste ${fmt(win)}!`); sndWin(tg>=5);
      if(window.Juice){ if(tg>=5) Juice.bigWin(win,{label:'¡GRAN PREMIO!',sub:tg.toFixed(2)+'x'}); else Juice.coins({count:50}); } }
    else{ $('winDisp').textContent=fmt(0); $('result').className='result lose'; setMsg(`❌ ${res.toFixed(2)}x < ${tg.toFixed(2)}x · Sin premio`); sndLose(); }
    rolling=false; $('rollBtn').disabled=false; syncUI();
  }

  $('target').addEventListener('input',syncUI);
  $('rollBtn').addEventListener('click',()=>{ ac(); roll(); });
  $('betUp').addEventListener('click',()=>{ if(!rolling&&betIdx<BETS.length-1){betIdx++;syncUI();} });
  $('betDown').addEventListener('click',()=>{ if(!rolling&&betIdx>0){betIdx--;syncUI();} });
  syncUI();
})();
</script>
</body>
</html>
