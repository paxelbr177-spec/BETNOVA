<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Nova Mines — BetNova</title>
<link rel="stylesheet" href="../_shared/juice.css" />
<style>
  :root{ --brand:#19e57f; --ink:#0a0e1a; --panel:#121829; --panel2:#1a2238; --gold:#ffc83d; --muted:#8a94ad; --red:#ff4d5e; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{ font-family:"Segoe UI",system-ui,Roboto,sans-serif; color:#e8eefc;
    background:radial-gradient(circle at 50% -10%, #163a55, var(--ink) 60%); min-height:100%; padding:14px; user-select:none; }
  .wrap{ max-width:520px; margin:0 auto; }
  .head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .head h1{ font-size:20px; font-weight:800; } .head h1 span{ color:var(--brand); }
  .head .tag{ font-size:11px; color:var(--muted); background:rgba(255,255,255,.06); padding:4px 10px; border-radius:999px; }
  .grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:8px; background:var(--panel); border:1px solid rgba(255,255,255,.07); border-radius:16px; padding:12px; }
  .tile{ aspect-ratio:1; border-radius:12px; background:linear-gradient(180deg,#243049,#1a2238); border:1px solid rgba(255,255,255,.06);
    display:grid; place-items:center; font-size:28px; cursor:pointer; transition:transform .06s, filter .15s; }
  .tile:hover:not(.done){ filter:brightness(1.2); transform:translateY(-2px); }
  .tile:active:not(.done){ transform:scale(.95); }
  .tile.gem{ background:linear-gradient(180deg,#0f5b39,#0a3d28); }
  .tile.mine{ background:linear-gradient(180deg,#5e1320,#3d0d16); }
  .tile.dim{ opacity:.45; }
  .hud{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px; }
  .stat{ background:var(--panel); border:1px solid rgba(255,255,255,.07); border-radius:10px; padding:9px; text-align:center; }
  .stat span{ display:block; font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; }
  .stat b{ font-size:18px; } .stat b.bal{ color:var(--brand);} .stat b.mult{ color:var(--gold);}
  .row{ display:flex; gap:10px; margin-top:12px; align-items:center; }
  .bet{ display:flex; align-items:center; gap:6px; background:var(--panel); border:1px solid rgba(255,255,255,.07); border-radius:12px; padding:8px 10px; }
  .bet button{ width:32px; height:32px; border-radius:8px; border:0; background:var(--panel2); color:#fff; font-size:18px; cursor:pointer; }
  .bet .v{ min-width:44px; text-align:center; font-weight:700; }
  .bet small{ font-size:10px; color:var(--muted); display:block; }
  .act{ flex:1; height:50px; border:0; border-radius:13px; cursor:pointer; font-size:16px; font-weight:800; color:var(--ink); background:linear-gradient(180deg,var(--brand),#0fb863); box-shadow:0 0 22px rgba(25,229,127,.4); }
  .act.cash{ background:linear-gradient(180deg,var(--gold),#e0a90c); }
  .act:disabled{ opacity:.5; cursor:not-allowed; box-shadow:none; }
  .msg{ text-align:center; min-height:22px; margin-top:10px; font-weight:700; color:var(--gold); }
  .foot{ margin-top:8px; text-align:center; font-size:10px; color:#5e6781; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="head"><h1>Nova <span>Mines</span></h1><span class="tag">Desarrollado por BetNova</span></div>
    <div class="grid" id="grid"></div>
    <div class="hud">
      <div class="stat"><span>Saldo</span><b class="bal" id="balance">1000.00</b></div>
      <div class="stat"><span>Multiplicador</span><b class="mult" id="multDisp">1.00x</b></div>
      <div class="stat"><span>Ganancia pot.</span><b id="potDisp">0.00</b></div>
    </div>
    <div class="row">
      <div class="bet"><button id="betDown">−</button><div class="v"><small>Apuesta</small><span id="betVal">10</span></div><button id="betUp">+</button></div>
      <div class="bet"><button id="minesDown">−</button><div class="v"><small>Minas</small><span id="minesVal">3</span></div><button id="minesUp">+</button></div>
    </div>
    <div class="row">
      <button class="act" id="actBtn">JUGAR</button>
    </div>
    <div class="msg" id="message">Elige apuesta y minas, luego ¡JUGAR!</div>
    <div class="foot">Nova Mines · juego original de BetNova · 5×5 · retira antes de pisar una mina</div>
  </div>
<script src="../_shared/house.js"></script>
<script src="../_shared/wallet-bridge.js"></script>
<script src="../_shared/juice.js"></script>
<script>
(function(){
  const T=25; const BETS=[50,100,250,500,1000];
  let betIdx=0, mines=3, balance=1000, state='idle';
  NovaWallet.ready(b=>{ balance=b; syncUI(); });
  NovaWallet.onBalance(b=>{ balance=b; syncUI(); });
  let mineSet=new Set(), revealed=0, mult=1, roundCanWin=true;
  const $=(id)=>document.getElementById(id);
  const fmt=(n)=>n.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2});

  let actx=null; const ac=()=>{ if(!actx){try{actx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}} if(actx&&actx.state==='suspended')actx.resume(); return actx; };
  function tone(f,d,t,v,glide){ const c=ac(); if(!c)return; const o=c.createOscillator(),g=c.createGain(); o.type=t||'sine'; o.frequency.setValueAtTime(f,c.currentTime); if(glide)o.frequency.exponentialRampToValueAtTime(glide,c.currentTime+d); g.gain.setValueAtTime(0.0001,c.currentTime); g.gain.exponentialRampToValueAtTime(v||0.12,c.currentTime+0.02); g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+d); o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d+0.02); }
  const sndGem=()=>tone(700+revealed*40,0.12,'triangle',0.10);
  const sndBoom=()=>tone(180,0.5,'sawtooth',0.16,50);
  const sndCash=()=>{ [660,880,1175].forEach((f,i)=>setTimeout(()=>tone(f,0.18,'triangle',0.12),i*70)); };

  // multiplicador justo tras k revelados (casa 1%)
  function multAfter(k){ let m=1; for(let i=0;i<k;i++){ m*= (T-i)/(T-mines-i); } return m*0.99; }

  function buildGrid(){
    const g=$('grid'); g.innerHTML='';
    for(let i=0;i<T;i++){ const t=document.createElement('div'); t.className='tile'; t.dataset.i=i; t.addEventListener('click',()=>pick(i)); g.appendChild(t); }
  }
  function tiles(){ return [...document.querySelectorAll('.tile')]; }

  function syncUI(){
    $('balance').textContent=fmt(balance);
    $('betVal').textContent=BETS[betIdx];
    $('minesVal').textContent=mines;
    $('multDisp').textContent=mult.toFixed(2)+'x';
    $('potDisp').textContent= state==='playing'? fmt(BETS[betIdx]*mult): fmt(0);
  }
  const setMsg=(t)=>$('message').textContent=t;

  function start(){
    if(state!=='idle')return;
    const bet=BETS[betIdx];
    if(balance<bet){ setMsg('Saldo insuficiente.'); return; }
    balance=NovaWallet.bet(bet);
    mineSet=new Set(); while(mineSet.size<mines){ mineSet.add(Math.floor(Math.random()*T)); }
    roundCanWin = (window.NovaHouse ? NovaHouse.allowWin() : true);
    revealed=0; mult=1; state='playing';
    tiles().forEach(t=>{ t.className='tile'; t.textContent=''; });
    $('actBtn').textContent='RETIRAR'; $('actBtn').classList.add('cash');
    setMsg('Destapa gemas 💎 … retírate cuando quieras');
    syncUI();
  }

  function pick(i){
    if(state!=='playing')return;
    const t=tiles()[i]; if(t.classList.contains('done'))return;
    // primer destape de la ronda: si la casa no permite ganar, forzar mina aquí
    if(revealed===0 && !roundCanWin && !mineSet.has(i)){
      const its=mineSet.values().next(); if(!its.done) mineSet.delete(its.value);
      mineSet.add(i);
    }
    if(mineSet.has(i)){
      t.classList.add('mine','done'); t.textContent='💣'; sndBoom();
      revealAll(i); state='idle'; mult=1;
      $('actBtn').textContent='JUGAR'; $('actBtn').classList.remove('cash');
      setMsg('💥 ¡Mina! Perdiste la apuesta.'); syncUI();
      return;
    }
    t.classList.add('gem','done'); t.textContent='💎'; revealed++;
    mult=multAfter(revealed); sndGem();
    setMsg(`💎 ${revealed} gemas · ${mult.toFixed(2)}x`);
    syncUI();
    if(revealed===T-mines){ cashOut(true); } // todas las seguras
  }

  function revealAll(hit){
    tiles().forEach((t,idx)=>{
      if(idx===hit)return;
      if(mineSet.has(idx)){ t.classList.add('mine','done','dim'); t.textContent='💣'; }
      else if(!t.classList.contains('done')){ t.classList.add('dim'); }
    });
  }

  function cashOut(auto){
    if(state!=='playing')return;
    const win=BETS[betIdx]*mult;
    balance=NovaWallet.win(win); sndCash();
    state='idle';
    $('actBtn').textContent='JUGAR'; $('actBtn').classList.remove('cash');
    setMsg(`✅ Retiraste ${mult.toFixed(2)}x · +${fmt(win)}`);
    if(window.Juice){ if(mult>=3) Juice.bigWin(win,{label:'¡GANASTE!',sub:mult.toFixed(2)+'x'}); else Juice.coins({count:50}); }
    tiles().forEach((t,idx)=>{ if(mineSet.has(idx)){ t.classList.add('dim'); } });
    syncUI();
  }

  $('actBtn').addEventListener('click',()=>{ ac(); if(state==='idle')start(); else cashOut(false); });
  $('betUp').addEventListener('click',()=>{ if(state==='idle'&&betIdx<BETS.length-1){betIdx++;syncUI();} });
  $('betDown').addEventListener('click',()=>{ if(state==='idle'&&betIdx>0){betIdx--;syncUI();} });
  $('minesUp').addEventListener('click',()=>{ if(state==='idle'&&mines<10){mines++;syncUI();} });
  $('minesDown').addEventListener('click',()=>{ if(state==='idle'&&mines>1){mines--;syncUI();} });

  buildGrid(); syncUI();
})();
</script>
</body>
</html>
