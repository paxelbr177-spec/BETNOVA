<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Nova Penalty — BetNova</title>
<link rel="stylesheet" href="../_shared/juice.css" />
<style>
  :root{ --brand:#19e57f; --ink:#0a0e1a; --panel:#121829; --panel2:#1a2238; --gold:#ffc83d; --muted:#8a94ad; --red:#ff4d5e; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{ font-family:"Segoe UI",system-ui,Roboto,sans-serif; color:#e8eefc;
    background:radial-gradient(circle at 50% -10%, #163a55, var(--ink) 60%);
    min-height:100%; padding:10px; user-select:none; -webkit-user-select:none; }
  .wrap{ max-width:480px; margin:0 auto; }
  .head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .head h1{ font-size:19px; font-weight:800; } .head h1 span{ color:var(--brand); }
  .head .tag{ font-size:10px; color:var(--muted); background:rgba(255,255,255,.06); padding:4px 9px; border-radius:999px; }
  .stage{ position:relative; border-radius:14px; overflow:hidden; border:1px solid rgba(255,255,255,.08); background:linear-gradient(180deg,#0d2438,#0a1120); box-shadow:0 12px 34px rgba(0,0,0,.5); }
  .pitch{ display:block; width:100%; height:auto; }
  .msg{ text-align:center; min-height:20px; margin-top:9px; font-weight:700; color:var(--gold); font-size:13px; }
  .hud{ display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-top:9px; }
  .stat{ background:var(--panel); border:1px solid rgba(255,255,255,.07); border-radius:10px; padding:8px; text-align:center; }
  .stat span{ display:block; font-size:9px; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; }
  .stat b{ font-size:16px; } .stat b.bal{ color:var(--brand);} .stat b.win{ color:var(--gold);}
  .betrow{ display:flex; justify-content:center; margin-top:10px; }
  .bet{ display:flex; align-items:center; gap:6px; background:var(--panel); border:1px solid rgba(255,255,255,.07); border-radius:12px; padding:7px 10px; }
  .bet button{ width:32px; height:32px; border-radius:8px; border:0; background:var(--panel2); color:#fff; font-size:18px; cursor:pointer; }
  .bet .v{ min-width:52px; text-align:center; font-weight:700; }
  .zones{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:10px; }
  .zone{ height:48px; border:0; border-radius:12px; cursor:pointer; font-size:14px; font-weight:800; color:var(--ink); background:linear-gradient(180deg,var(--brand),#0fb863); box-shadow:0 0 18px rgba(25,229,127,.32); transition:filter .15s, transform .1s; }
  .zone:active{ transform:translateY(2px); }
  .zone:disabled{ opacity:.45; cursor:not-allowed; box-shadow:none; }
  .foot{ margin-top:7px; text-align:center; font-size:9px; color:#5e6781; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="head"><h1>Nova <span>Penalty</span></h1><span class="tag">Desarrollado por BetNova</span></div>
    <div class="stage">
      <svg class="pitch" id="pitch" viewBox="0 0 360 230" xmlns="http://www.w3.org/2000/svg">
        <!-- césped -->
        <rect x="0" y="0" width="360" height="230" fill="#0e3a24"/>
        <rect x="0" y="0" width="360" height="230" fill="url(#stripes)"/>
        <defs>
          <pattern id="stripes" width="40" height="230" patternUnits="userSpaceOnUse">
            <rect x="0" y="0" width="20" height="230" fill="rgba(255,255,255,.03)"/>
          </pattern>
        </defs>
        <!-- portería -->
        <g stroke="#eef3fb" stroke-width="3" fill="none">
          <rect x="60" y="38" width="240" height="92" rx="2"/>
        </g>
        <!-- red -->
        <g stroke="rgba(255,255,255,.16)" stroke-width="1">
          <line x1="72" y1="38" x2="72" y2="130"/><line x1="84" y1="38" x2="84" y2="130"/>
          <line x1="96" y1="38" x2="96" y2="130"/><line x1="108" y1="38" x2="108" y2="130"/>
          <line x1="120" y1="38" x2="120" y2="130"/><line x1="132" y1="38" x2="132" y2="130"/>
          <line x1="144" y1="38" x2="144" y2="130"/><line x1="156" y1="38" x2="156" y2="130"/>
          <line x1="168" y1="38" x2="168" y2="130"/><line x1="180" y1="38" x2="180" y2="130"/>
          <line x1="192" y1="38" x2="192" y2="130"/><line x1="204" y1="38" x2="204" y2="130"/>
          <line x1="216" y1="38" x2="216" y2="130"/><line x1="228" y1="38" x2="228" y2="130"/>
          <line x1="240" y1="38" x2="240" y2="130"/><line x1="252" y1="38" x2="252" y2="130"/>
          <line x1="264" y1="38" x2="264" y2="130"/><line x1="276" y1="38" x2="276" y2="130"/>
          <line x1="288" y1="38" x2="288" y2="130"/>
          <line x1="60" y1="50" x2="300" y2="50"/><line x1="60" y1="62" x2="300" y2="62"/>
          <line x1="60" y1="74" x2="300" y2="74"/><line x1="60" y1="86" x2="300" y2="86"/>
          <line x1="60" y1="98" x2="300" y2="98"/><line x1="60" y1="110" x2="300" y2="110"/>
          <line x1="60" y1="122" x2="300" y2="122"/>
        </g>
        <!-- área -->
        <g stroke="rgba(255,255,255,.35)" stroke-width="2" fill="none">
          <rect x="30" y="130" width="300" height="70"/>
          <circle cx="180" cy="210" r="3" fill="#fff" stroke="none"/>
        </g>

        <!-- portero -->
        <g id="keeper" style="transform:translateX(0px);transition:transform .42s cubic-bezier(.34,1.3,.5,1);">
          <g id="keeperBody">
            <!-- guantes/brazos -->
            <rect x="166" y="58" width="28" height="9" rx="4" fill="#ffc83d"/>
            <!-- cuerpo -->
            <rect x="172" y="64" width="16" height="30" rx="6" fill="#19e57f"/>
            <!-- cabeza -->
            <circle cx="180" cy="56" r="8" fill="#f4c79a"/>
            <!-- piernas -->
            <rect x="173" y="92" width="5" height="18" rx="2" fill="#0c1426"/>
            <rect x="182" y="92" width="5" height="18" rx="2" fill="#0c1426"/>
          </g>
        </g>

        <!-- balón -->
        <g id="ball" style="transform:translate(0px,0px) scale(1);transition:transform .4s cubic-bezier(.4,.6,.5,1);">
          <g transform="translate(180,205)">
            <circle r="9" fill="#fdfdfd" stroke="#cfd6e2" stroke-width="1"/>
            <path d="M0,-9 L5,-3 L3,4 L-3,4 L-5,-3 Z" fill="#0a0e1a"/>
            <path d="M0,-9 L5,-3 M5,-3 L3,4 M3,4 L-3,4 M-3,4 L-5,-3 M-5,-3 L0,-9" stroke="#7a8294" stroke-width=".7" fill="none"/>
          </g>
        </g>
      </svg>
    </div>
    <div class="msg" id="message">Elige una zona y dispara ⚽</div>
    <div class="hud">
      <div class="stat"><span>Saldo</span><b class="bal" id="balance">1000.00</b></div>
      <div class="stat"><span>Apuesta</span><b id="betDisp">50.00</b></div>
      <div class="stat"><span>Ganancia</span><b class="win" id="winDisp">0.00</b></div>
    </div>
    <div class="betrow">
      <div class="bet">
        <button id="betDown">−</button><div class="v" id="betVal">50</div><button id="betUp">+</button>
      </div>
    </div>
    <div class="zones">
      <button class="zone" id="zoneL" data-zone="0">IZQUIERDA</button>
      <button class="zone" id="zoneC" data-zone="1">CENTRO</button>
      <button class="zone" id="zoneR" data-zone="2">DERECHA</button>
    </div>
    <div class="foot">Nova Penalty · juego original de BetNova · gol paga 2.91x</div>
  </div>
<script src="../_shared/house.js"></script>
<script src="../_shared/wallet-bridge.js"></script>
<script src="../_shared/juice.js"></script>
<script>
(function(){
  const BETS=[50,100,250,500,1000]; let betIdx=0;
  const PAY=2.91;
  // posiciones x (px del viewBox) por zona: 0=izq 1=centro 2=der
  const ZONE_X=[-95, 0, 95];      // desplazamiento del portero/balón
  const ZONE_BALL=[-100, 0, 100]; // desplazamiento horizontal del balón

  let balance=1000, shooting=false;

  const $=(id)=>document.getElementById(id);
  const fmt=(n)=>n.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2});

  // Audio: solo un "kick" sutil; los sonidos de win/bet los pone el sistema compartido.
  let actx=null; const ac=()=>{ if(!actx){try{actx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}} if(actx&&actx.state==='suspended')actx.resume(); return actx; };
  function kick(){ const c=ac(); if(!c)return; const o=c.createOscillator(),g=c.createGain(); o.type='sine'; o.frequency.setValueAtTime(180,c.currentTime); o.frequency.exponentialRampToValueAtTime(60,c.currentTime+0.12); g.gain.setValueAtTime(0.0001,c.currentTime); g.gain.exponentialRampToValueAtTime(0.2,c.currentTime+0.01); g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+0.16); o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+0.18); }

  function syncUI(){
    $('balance').textContent=fmt(balance);
    $('betDisp').textContent=fmt(BETS[betIdx]);
    $('betVal').textContent=BETS[betIdx];
    const dis=shooting;
    $('zoneL').disabled=dis; $('zoneC').disabled=dis; $('zoneR').disabled=dis;
    $('betUp').disabled=dis; $('betDown').disabled=dis;
  }
  function setMsg(t){ $('message').textContent=t; }

  function moveKeeper(zone){ $('keeper').style.transform='translateX('+ZONE_X[zone]+'px)'; }
  function moveBall(zone, scale){ $('ball').style.transform='translate('+ZONE_BALL[zone]+'px,-150px) scale('+scale+')'; }
  function resetBall(){ $('ball').style.transition='none'; $('ball').style.transform='translate(0px,0px) scale(1)'; void $('ball').offsetWidth; $('ball').style.transition='transform .4s cubic-bezier(.4,.6,.5,1)'; }

  function shoot(zone){
    if(shooting) return;
    const bet=BETS[betIdx];
    if(balance<bet){ setMsg('Saldo insuficiente.'); return; }
    ac();
    shooting=true;
    syncUI();
    balance=NovaWallet.bet(bet);
    $('winDisp').textContent=fmt(0);
    setMsg('¡Disparo!');
    kick();

    // ¿Permite la casa esta victoria?
    const canWin = (window.NovaHouse ? NovaHouse.allowWin(PAY) : true);
    // El portero se tira a una zona. Si gana → zona distinta. Si pierde → misma zona del jugador.
    let keeperZone;
    if(canWin){
      const others=[0,1,2].filter(z=>z!==zone);
      keeperZone=others[Math.floor(Math.random()*others.length)];
    } else {
      keeperZone=zone;
    }

    // animar balón hacia la zona elegida y portero hacia su decisión
    moveBall(zone, 0.55);
    moveKeeper(keeperZone);

    setTimeout(()=>{
      const goal = (keeperZone!==zone);
      // reset estado ANTES de syncUI
      shooting=false;
      if(goal){
        const win=bet*PAY;
        balance=NovaWallet.win(win);
        $('winDisp').textContent=fmt(win);
        setMsg('¡GOOOL! +'+fmt(win));
        if(window.Juice) Juice.win(win,{ mult:PAY, el:$('winDisp') });
      } else {
        setMsg('¡Atajada! El portero la detuvo.');
      }
      syncUI();
      // volver a colocar todo tras un momento
      setTimeout(()=>{ resetBall(); moveKeeper(1); }, 1100);
    }, 480);
  }

  $('zoneL').addEventListener('click',()=>shoot(0));
  $('zoneC').addEventListener('click',()=>shoot(1));
  $('zoneR').addEventListener('click',()=>shoot(2));
  $('betUp').addEventListener('click',()=>{ if(!shooting&&betIdx<BETS.length-1){betIdx++;syncUI();} });
  $('betDown').addEventListener('click',()=>{ if(!shooting&&betIdx>0){betIdx--;syncUI();} });

  // render inicial
  syncUI();

  // ¡SIEMPRE AL FINAL! evitar TDZ con const $ definido arriba
  NovaWallet.ready(b=>{ balance=b; syncUI(); });
  NovaWallet.onBalance(b=>{ balance=b; syncUI(); });
})();
</script>
</body>
</html>
