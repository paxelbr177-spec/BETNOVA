<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Nova Plinko — BetNova</title>
<link rel="stylesheet" href="../_shared/juice.css" />
<style>
  :root{ --brand:#19e57f; --ink:#0a0e1a; --panel:#121829; --panel2:#1a2238; --gold:#ffc83d; --muted:#8a94ad; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{ font-family:"Segoe UI",system-ui,Roboto,sans-serif; color:#e8eefc;
    background:radial-gradient(circle at 50% -10%, #163a55, var(--ink) 60%); min-height:100%; padding:14px; user-select:none; }
  .wrap{ max-width:560px; margin:0 auto; }
  .head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .head h1{ font-size:20px; font-weight:800; } .head h1 span{ color:var(--brand); }
  .head .tag{ font-size:11px; color:var(--muted); background:rgba(255,255,255,.06); padding:4px 10px; border-radius:999px; }
  .stage{ border-radius:16px; overflow:hidden; border:1px solid rgba(255,255,255,.08); background:#0a1120; box-shadow:0 14px 40px rgba(0,0,0,.5); }
  canvas{ display:block; width:100%; height:auto; }
  .hud{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px; }
  .stat{ background:var(--panel); border:1px solid rgba(255,255,255,.07); border-radius:10px; padding:9px; text-align:center; }
  .stat span{ display:block; font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; }
  .stat b{ font-size:18px; } .stat b.bal{ color:var(--brand);} .stat b.win{ color:var(--gold);}
  .controls{ display:flex; gap:10px; margin-top:12px; }
  .bet{ display:flex; align-items:center; gap:6px; background:var(--panel); border:1px solid rgba(255,255,255,.07); border-radius:12px; padding:8px 10px; }
  .bet button{ width:32px; height:32px; border-radius:8px; border:0; background:var(--panel2); color:#fff; font-size:18px; cursor:pointer; }
  .bet .v{ min-width:54px; text-align:center; font-weight:700; }
  .act{ flex:1; height:50px; border:0; border-radius:13px; cursor:pointer; font-size:17px; font-weight:800; color:var(--ink); background:linear-gradient(180deg,var(--brand),#0fb863); box-shadow:0 0 22px rgba(25,229,127,.4); }
  .act:disabled{ opacity:.5; cursor:not-allowed; box-shadow:none; }
  .msg{ text-align:center; min-height:22px; margin-top:10px; font-weight:700; color:var(--gold); }
  .foot{ margin-top:8px; text-align:center; font-size:10px; color:#5e6781; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="head"><h1>Nova <span>Plinko</span></h1><span class="tag">Desarrollado por BetNova</span></div>
    <div class="stage"><canvas id="cv" width="520" height="440"></canvas></div>
    <div class="hud">
      <div class="stat"><span>Saldo</span><b class="bal" id="balance">1000.00</b></div>
      <div class="stat"><span>Apuesta</span><b id="betDisp">10.00</b></div>
      <div class="stat"><span>Ganancia</span><b class="win" id="winDisp">0.00</b></div>
    </div>
    <div class="controls">
      <div class="bet"><button id="betDown">−</button><div class="v" id="betVal">10</div><button id="betUp">+</button></div>
      <button class="act" id="dropBtn">SOLTAR BOLA</button>
    </div>
    <div class="msg" id="message">Pulsa SOLTAR BOLA 🔵</div>
    <div class="foot">Nova Plinko · juego original de BetNova · 12 filas · los bordes pagan más</div>
  </div>
<script src="../_shared/house.js"></script>
<script src="../_shared/wallet-bridge.js"></script>
<script src="../_shared/juice.js"></script>
<script>
(function(){
  const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
  const W=cv.width, H=cv.height;
  const ROWS=12, SLOTS=ROWS+1;
  const BETS=[50,100,250,500,1000]; let betIdx=0;
  let balance=1000, dropping=false;
  // Conexión con la billetera de BetNova (o demo local si se abre suelto/invitado)
  NovaWallet.ready(b=>{ balance=b; syncUI(); });
  NovaWallet.onBalance(b=>{ balance=b; syncUI(); });
  // multiplicadores por cubeta (simétricos, bordes altos; centro 0x = pierdes)
  const MULT=[15,4,2,1.4,1,0.3,0,0.3,1,1.4,2,4,15];
  const COLORS=MULT.map(m=> m>=5?'#ff4d5e':m>=1.5?'#ffc83d':m>=1?'#5b8cff':m>0?'#2bbd6a':'#3a4256');
  const $=(id)=>document.getElementById(id);
  const fmt=(n)=>n.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2});

  let actx=null; const ac=()=>{ if(!actx){try{actx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}} if(actx&&actx.state==='suspended')actx.resume(); return actx; };
  function tone(f,d,t,v){ const c=ac(); if(!c)return; const o=c.createOscillator(),g=c.createGain(); o.type=t||'sine'; o.frequency.value=f; g.gain.setValueAtTime(0.0001,c.currentTime); g.gain.exponentialRampToValueAtTime(v||0.08,c.currentTime+0.005); g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+d); o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d+0.02); }
  const sndPeg=()=>tone(500+Math.random()*300,0.05,'square',0.04);
  const sndLand=(big)=>{ (big?[660,880,1175]:[440,330]).forEach((f,i)=>setTimeout(()=>tone(f,0.16,'triangle',0.12),i*70)); };

  const topY=30, botY=H-46, pegGapY=(botY-topY)/ROWS;
  const cx=W/2, pegGapX=34;
  function pegPos(r,i){ const count=r+3; const y=topY+r*pegGapY; const x=cx - ((count-1)/2)*pegGapX + i*pegGapX; return {x,y}; }

  function slotX(s){ const count=SLOTS; return cx - ((count-1)/2)*pegGapX + s*pegGapX; }

  function drawBoard(ball){
    ctx.fillStyle='#0a1120'; ctx.fillRect(0,0,W,H);
    // pegs
    ctx.fillStyle='rgba(255,255,255,.55)';
    for(let r=0;r<ROWS;r++){ for(let i=0;i<r+3;i++){ const p=pegPos(r,i); ctx.beginPath(); ctx.arc(p.x,p.y,3,0,7); ctx.fill(); } }
    // cubetas
    for(let s=0;s<SLOTS;s++){ const x=slotX(s); ctx.fillStyle=COLORS[s]; const w=pegGapX-4; ctx.fillRect(x-w/2,botY+6,w,30); ctx.fillStyle='#0a0e1a'; ctx.font='bold 11px Segoe UI'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(MULT[s]+'x',x,botY+21); }
    // bola
    if(ball){ ctx.fillStyle='#19e57f'; ctx.beginPath(); ctx.arc(ball.x,ball.y,7,0,7); ctx.fill(); ctx.fillStyle='rgba(255,255,255,.4)'; ctx.beginPath(); ctx.arc(ball.x-2,ball.y-2,2.5,0,7); ctx.fill(); }
  }

  function syncUI(){ $('balance').textContent=fmt(balance); $('betDisp').textContent=fmt(BETS[betIdx]); $('betVal').textContent=BETS[betIdx]; }
  const setMsg=(t)=>$('message').textContent=t;

  function drop(){
    if(dropping)return;
    const bet=BETS[betIdx];
    if(balance<bet){ setMsg('Saldo insuficiente.'); return; }
    balance=NovaWallet.bet(bet); syncUI(); dropping=true; setMsg('🔵 Cayendo…'); $('dropBtn').disabled=true;
    // decidir camino: en cada fila izquierda/derecha
    // sesgo de la casa: elegir primero la cubeta final (índice = nº de derechas)
    const canWin = (window.NovaHouse ? NovaHouse.allowWin() : true);
    const buckets=[]; for(let s=0;s<SLOTS;s++){ if(canWin ? MULT[s]>=1.5 : MULT[s]<1) buckets.push(s); }
    const slot = buckets[Math.floor(Math.random()*buckets.length)];
    // construir un camino con exactamente `slot` derechas distribuidas al azar
    let path=Array(ROWS).fill(0);
    { let idxs=[]; for(let r=0;r<ROWS;r++) idxs.push(r);
      for(let k=0;k<slot;k++){ const j=Math.floor(Math.random()*idxs.length); path[idxs[j]]=1; idxs.splice(j,1); } }
    // animar
    let r=0, t=0; let ball={x:cx, y:topY-10};
    let fromX=cx, toX=pegPos(0, path[0]? 2:1).x; // aproximación visual
    function step(){
      t+=0.06;
      if(r<ROWS){
        const p0=r===0? {x:cx,y:topY-10} : pegPos(r-1, partial(r-1));
        const p1=pegPos(r, partial(r));
        ball.x = p0.x + (p1.x-p0.x)*t;
        ball.y = p0.y + (p1.y-p0.y)*t + Math.sin(t*Math.PI)*-6;
        if(t>=1){ t=0; r++; sndPeg(); }
      } else {
        // caer a la cubeta
        const tx=slotX(slot), ty=botY+18;
        ball.x += (tx-ball.x)*0.25; ball.y += (ty-ball.y)*0.25;
        if(Math.abs(ball.y-ty)<1){ return land(slot); }
      }
      drawBoard(ball); requestAnimationFrame(step);
    }
    function partial(rr){ let s=0; for(let k=0;k<=rr;k++)s+=path[k]; return s; }
    requestAnimationFrame(step);
  }

  function land(slot){
    const m=MULT[slot], bet=BETS[betIdx], win=bet*m;
    balance=NovaWallet.win(win); $('winDisp').textContent=fmt(win);
    drawBoard({x:slotX(slot),y:botY+18});
    const big=m>=3;
    if(m===0) setMsg(`Cayó en 0x · 😕 sin premio`);
    else if(win>=bet) setMsg(`Cayó en ${m}x · +${fmt(win)} 🎉`);
    else setMsg(`Cayó en ${m}x · recuperas ${fmt(win)}`);
    sndLand(big);
    // efectos visuales
    if(window.Juice){ if(big) Juice.bigWin(win,{label:'¡GANASTE!',sub:m+'x'}); else if(win>0) Juice.coins({count:50}); }
    dropping=false; $('dropBtn').disabled=false;
    syncUI();
  }

  $('dropBtn').addEventListener('click',()=>{ ac(); drop(); });
  $('betUp').addEventListener('click',()=>{ if(!dropping&&betIdx<BETS.length-1){betIdx++;syncUI();} });
  $('betDown').addEventListener('click',()=>{ if(!dropping&&betIdx>0){betIdx--;syncUI();} });

  drawBoard(null); syncUI();
})();
</script>
</body>
</html>
