<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Nova Roulette — BetNova</title>
<link rel="stylesheet" href="style.css?v=20260615c" />
<link rel="stylesheet" href="../_shared/juice.css?v=20260615c" />
</head>
<body>
  <div class="wrap">
    <div class="head">
      <h1>Nova <span>Roulette</span></h1>
      <span class="tag">Europea · Desarrollado por BetNova</span>
    </div>

    <div class="layout">
      <!-- Rueda + HUD -->
      <div>
        <div class="wheelcard">
          <div class="wheel-container" id="wheel"></div>
          <div class="result" id="result">
            <span class="lbl">Haz tu apuesta y gira</span>
          </div>
        </div>
        <div class="hud">
          <div class="stat"><span>Saldo</span><b class="bal" id="balance">1000.00</b></div>
          <div class="stat"><span>Apuesta</span><b id="totalBet">0.00</b></div>
          <div class="stat"><span>Ganancia</span><b class="win" id="lastWin">0.00</b></div>
        </div>
      </div>

      <!-- Mesa + controles -->
      <div class="boardcard">
        <div class="rtable">
          <div class="zero" data-bet="straight:0">0</div>
          <div class="gridwrap">
            <div class="grid" id="grid"></div>
          </div>
          <div class="colbets">
            <div class="bet" data-bet="col:top">2:1</div>
            <div class="bet" data-bet="col:mid">2:1</div>
            <div class="bet" data-bet="col:bot">2:1</div>
          </div>
        </div>

        <div class="rowbets">
          <div class="bet" data-bet="dozen:1">1ª docena</div>
          <div class="bet" data-bet="dozen:2">2ª docena</div>
          <div class="bet" data-bet="dozen:3">3ª docena</div>
        </div>

        <div class="outside">
          <div class="bet" data-bet="low">1-18</div>
          <div class="bet" data-bet="even">PAR</div>
          <div class="bet red" data-bet="red">ROJO</div>
          <div class="bet black" data-bet="black">NEGRO</div>
          <div class="bet" data-bet="odd">IMPAR</div>
          <div class="bet" data-bet="high">19-36</div>
        </div>

        <div class="controls">
          <div class="chips" id="chips">
            <button class="chipbtn c1 sel" data-chip="50">50</button>
            <button class="chipbtn c5" data-chip="100">100</button>
            <button class="chipbtn c25" data-chip="250">250</button>
            <button class="chipbtn c100" data-chip="500">500</button>
            <button class="chipbtn c1000" data-chip="1000">1000</button>
          </div>
          <button class="ghost" id="clearBtn">Limpiar</button>
          <button class="spin" id="spinBtn">GIRAR</button>
        </div>

        <div class="msg" id="message"></div>
        <div class="foot">Nova Roulette · BetNova · rueda: librería ISC (TheBlindHawk) · mesa, fichas y pagos originales</div>
      </div>
    </div>
  </div>

  <script src="../_shared/house.js?v=20260615c"></script>
  <script src="../_shared/wallet-bridge.js?v=20260615c"></script>
  <script src="../_shared/juice.js?v=20260615c"></script>
  <script type="module" src="game.js?v=20260615c"></script>
</body>
</html>
