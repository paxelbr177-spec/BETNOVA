<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Nova Scratch — BetNova</title>
<link rel="stylesheet" href="../_shared/juice.css" />
<style>
  :root{ --brand:#19e57f; --ink:#0a0e1a; --panel:#121829; --panel2:#1a2238; --gold:#ffc83d; --muted:#8a94ad; --red:#ff4d5e; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{ font-family:"Segoe UI",system-ui,Roboto,sans-serif; color:#e8eefc;
    background:radial-gradient(circle at 50% -10%, #163a55, var(--ink) 60%);
    min-height:100%; padding:10px; user-select:none; -webkit-user-select:none; }
  .wrap{ max-width:420px; margin:0 auto; }
  .head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .head h1{ font-size:19px; font-weight:800; } .head h1 span{ color:var(--brand); }
  .head .tag{ font-size:10px; color:var(--muted); background:rgba(255,255,255,.06); padding:4px 9px; border-radius:999px; }
  .card{ position:relative; border-radius:16px; border:1px solid rgba(255,255,255,.08); background:linear-gradient(160deg,#0e1830,#0a1120); box-shadow:0 14px 40px rgba(0,0,0,.5); padding:12px; }
  .grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .cell{ position:relative; aspect-ratio:1/1; border-radius:12px; background:var(--panel2); border:1px solid rgba(255,255,255,.06); overflow:hidden; cursor:pointer; }
  .cell .sym, .cell .cover{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  .cell .sym svg, .cell .cover svg{ width:62%; height:62%; }
  .cell .cover{ background:linear-gradient(145deg,#2a3556,#161e34); transition:opacity .35s ease, transform .35s ease; z-index:2; }
  .cell .sym{ opacity:0; transform:scale(.6); transition:opacity .35s ease, transform .35s ease; }
  .cell.revealed .cover{ opacity:0; transform:scale(1.15); pointer-events:none; }
  .cell.revealed .sym{ opacity:1; transform:scale(1); }
  .cell.hit{ box-shadow:0 0 0 2px var(--gold), 0 0 16px rgba(255,200,61,.5); }
  .cell.idle{ cursor:default; }
  .cell.idle .cover{ opacity:.45; }
  .hud{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px; }
  .stat{ background:var(--panel); border:1px solid rgba(255,255,255,.07); border-radius:10px; padding:8px; text-align:center; }
  .stat span{ display:block; font-size:9px; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; }
  .stat b{ font-size:17px; } .stat b.bal{ color:var(--brand);} .stat b.win{ color:var(--gold);}
  .controls{ display:flex; gap:8px; margin-top:10px; }
  .bet{ display:flex; align-items:center; gap:5px; background:var(--panel); border:1px solid rgba(255,255,255,.07); border-radius:12px; padding:7px 9px; }
  .bet button{ width:30px; height:30px; border-radius:8px; border:0; background:var(--panel2); color:#fff; font-size:18px; cursor:pointer; }
  .bet .v{ min-width:48px; text-align:center; font-weight:700; }
  .act{ flex:1; height:46px; border:0; border-radius:13px; cursor:pointer; font-size:16px; font-weight:800; color:var(--ink); background:linear-gradient(180deg,var(--brand),#0fb863); box-shadow:0 0 20px rgba(25,229,127,.4); transition:filter .15s; }
  .act.rev{ background:linear-gradient(180deg,var(--gold),#e0a90c); }
  .act:disabled{ opacity:.5; cursor:not-allowed; box-shadow:none; }
  .msg{ text-align:center; min-height:20px; margin-top:9px; font-weight:700; color:var(--gold); font-size:13px; }
  .legend{ display:flex; gap:5px; flex-wrap:wrap; justify-content:center; margin-top:9px; }
  .legend b{ display:flex; align-items:center; gap:3px; font-size:10px; padding:3px 7px; border-radius:999px; background:var(--panel2); color:var(--muted); }
  .legend b svg{ width:13px; height:13px; }
  .foot{ margin-top:7px; text-align:center; font-size:9px; color:#5e6781; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="head"><h1>Nova <span>Scratch</span></h1><span class="tag">Desarrollado por BetNova</span></div>
    <div class="card">
      <div class="grid" id="grid"></div>
    </div>
    <div class="hud">
      <div class="stat"><span>Saldo</span><b class="bal" id="balance">1000.00</b></div>
      <div class="stat"><span>Apuesta</span><b id="betDisp">50.00</b></div>
      <div class="stat"><span>Ganancia</span><b class="win" id="winDisp">0.00</b></div>
    </div>
    <div class="controls">
      <div class="bet">
        <button id="betDown">−</button><div class="v" id="betVal">50</div><button id="betUp">+</button>
      </div>
      <button class="act" id="actBtn">RASPAR</button>
    </div>
    <div class="msg" id="message">Pon tu apuesta y raspa la tarjeta 🎟️</div>
    <div class="legend" id="legend"></div>
    <div class="foot">Nova Scratch · raspadita original de BetNova · 3 iguales = premio</div>
  </div>
<script src="../_shared/house.js"></script>
<script src="../_shared/wallet-bridge.js"></script>
<script src="../_shared/juice.js"></script>
<script>
(function(){
  // ---- símbolos (SVG inline con gradientes) y premios ----
  const ICONS={
    clover:`<svg viewBox="0 0 64 64"><defs><linearGradient id="g_clv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5dffa0"/><stop offset="1" stop-color="#0fb863"/></linearGradient></defs><g fill="url(#g_clv)"><circle cx="24" cy="24" r="11"/><circle cx="40" cy="24" r="11"/><circle cx="24" cy="40" r="11"/><circle cx="40" cy="40" r="11"/></g><rect x="30" y="38" width="4" height="20" rx="2" fill="#0a7a44"/></svg>`,
    bell:`<svg viewBox="0 0 64 64"><defs><linearGradient id="g_bel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe89a"/><stop offset="1" stop-color="#e0900c"/></linearGradient></defs><path d="M32 8a5 5 0 0 1 5 5v2c8 3 11 10 11 19 0 7 2 10 4 13H12c2-3 4-6 4-13 0-9 3-16 11-19v-2a5 5 0 0 1 5-5z" fill="url(#g_bel)" stroke="#a9650a" stroke-width="1.5"/><circle cx="32" cy="54" r="5" fill="#c8780c"/></svg>`,
    star:`<svg viewBox="0 0 64 64"><defs><linearGradient id="g_str" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9bd5ff"/><stop offset="1" stop-color="#2f7fe0"/></linearGradient></defs><path d="M32 4l8 18 20 2-15 13 5 20-18-11-18 11 5-20L4 24l20-2z" fill="url(#g_str)" stroke="#1b5bb0" stroke-width="1.5"/></svg>`,
    seven:`<svg viewBox="0 0 64 64"><defs><linearGradient id="g_sev" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8d9c"/><stop offset="1" stop-color="#d31f33"/></linearGradient></defs><path d="M18 12h30l-2 9-13 32h-12l13-30H18z" fill="url(#g_sev)" stroke="#9c1424" stroke-width="1.5"/></svg>`,
    diamond:`<svg viewBox="0 0 64 64"><defs><linearGradient id="g_dia" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b6f3ff"/><stop offset="1" stop-color="#19c5e5"/></linearGradient></defs><path d="M14 14h36l10 12-28 32L4 26z" fill="url(#g_dia)" stroke="#0e8aa3" stroke-width="1.5"/><path d="M14 14l8 12h20l8-12M4 26h56M32 58l-10-32M32 58l10-32" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1"/></svg>`,
    coin:`<svg viewBox="0 0 64 64"><defs><radialGradient id="g_coin" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#fff0b0"/><stop offset="1" stop-color="#e0900c"/></radialGradient></defs><circle cx="32" cy="32" r="26" fill="url(#g_coin)" stroke="#a9650a" stroke-width="2"/><circle cx="32" cy="32" r="19" fill="none" stroke="#fff3c4" stroke-width="1.5"/><text x="32" y="42" font-size="24" font-weight="900" text-anchor="middle" fill="#a9650a" font-family="Segoe UI,sans-serif">$</text></svg>`
  };
  // cover (gold "?" coin look)
  const COVER=`<svg viewBox="0 0 64 64"><defs><radialGradient id="g_cv" cx="40%" cy="35%" r="75%"><stop offset="0" stop-color="#ffd76b"/><stop offset="1" stop-color="#c2860d"/></radialGradient></defs><circle cx="32" cy="32" r="25" fill="url(#g_cv)" stroke="#8a5e08" stroke-width="2"/><text x="32" y="44" font-size="30" font-weight="900" text-anchor="middle" fill="#7a5206" font-family="Segoe UI,sans-serif">?</text></svg>`;

  // prize multipliers per symbol
  const PRIZE={ clover:2, bell:3, star:5, seven:10, diamond:20, coin:50 };
  const SYMS=Object.keys(PRIZE);           // todos los símbolos
  const NAMES={ clover:'Trébol', bell:'Campana', star:'Estrella', seven:'Siete', diamond:'Diamante', coin:'Jackpot' };

  const BETS=[50,100,250,500,1000]; let betIdx=0;
  let balance=1000, busy=false, card=null, prizeMult=0, winSym=null, revealed=0, settled=false;

  const $=(id)=>document.getElementById(id);
  const fmt=(n)=>n.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2});

  // ---- audio sintetizado ----
  let actx=null; const ac=()=>{ if(!actx){try{actx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}} if(actx&&actx.state==='suspended')actx.resume(); return actx; };
  function tone(f,d,t,v,glide){ const c=ac(); if(!c)return; const o=c.createOscillator(),g=c.createGain(); o.type=t||'sine'; o.frequency.setValueAtTime(f,c.currentTime); if(glide)o.frequency.exponentialRampToValueAtTime(glide,c.currentTime+d); g.gain.setValueAtTime(0.0001,c.currentTime); g.gain.exponentialRampToValueAtTime(v||0.12,c.currentTime+0.02); g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+d); o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d+0.02); }
  const sndTick=()=>tone(420+Math.random()*120,0.07,'square',0.05,260);
  const sndWin=()=>{ [660,880,1175,1568].forEach((f,i)=>setTimeout(()=>tone(f,0.18,'triangle',0.12),i*80)); };
  const sndLose=()=>tone(180,0.32,'sawtooth',0.10,90);

  // ---- generación de tarjeta con modo casa ----
  function randSym(){ return SYMS[(Math.random()*SYMS.length)|0]; }

  // arma una tarjeta SIN tres iguales (perdedora)
  function genLosingCard(){
    while(true){
      const c=[]; for(let i=0;i<9;i++)c.push(randSym());
      const counts={}; let max=0;
      c.forEach(s=>{ counts[s]=(counts[s]||0)+1; if(counts[s]>max)max=counts[s]; });
      if(max<3) return c;
    }
  }
  // arma una tarjeta GANADORA con exactamente 3 del símbolo dado (sin otro trío)
  function genWinningCard(sym){
    while(true){
      const pos=[0,1,2,3,4,5,6,7,8].sort(()=>Math.random()-0.5).slice(0,3);
      const others=SYMS.filter(s=>s!==sym);
      const c=new Array(9).fill(null);
      pos.forEach(p=>c[p]=sym);
      for(let i=0;i<9;i++) if(c[i]===null) c[i]=others[(Math.random()*others.length)|0];
      const counts={}; let ok=true;
      c.forEach(s=>{ counts[s]=(counts[s]||0)+1; });
      // ningún otro símbolo debe llegar a 3+
      for(const s in counts){ if(s!==sym && counts[s]>=3){ ok=false; break; } }
      if(counts[sym]===3 && ok) return c;
    }
  }

  function newCard(){
    // 1) decide un símbolo ganador candidato (premios altos más raros: peso 1/mult)
    const weights=SYMS.map(s=>1/PRIZE[s]);
    const total=weights.reduce((a,b)=>a+b,0);
    let r=Math.random()*total, pick=SYMS[0];
    for(let i=0;i<SYMS.length;i++){ r-=weights[i]; if(r<=0){ pick=SYMS[i]; break; } }
    const mult=PRIZE[pick];
    // 2) modo casa: solo se concede la victoria si allowWin(mult) pasa.
    //    Multiplicadores altos => prob baja => premios grandes muy raros.
    const canWin=(window.NovaHouse ? NovaHouse.allowWin(mult) : true);
    if(canWin){ winSym=pick; prizeMult=mult; card=genWinningCard(pick); }
    else      { winSym=null; prizeMult=0; card=genLosingCard(); }
  }

  // ---- render ----
  function buildGrid(){
    const g=$('grid'); g.innerHTML='';
    for(let i=0;i<9;i++){
      const cell=document.createElement('div');
      cell.className='cell idle';
      cell.dataset.idx=i;
      cell.innerHTML=`<div class="sym"></div><div class="cover">${COVER}</div>`;
      g.appendChild(cell);
    }
  }
  function paintCard(){
    const cells=$('grid').children;
    for(let i=0;i<9;i++){
      cells[i].className='cell';            // armada y rascable, no idle
      cells[i].querySelector('.sym').innerHTML=ICONS[card[i]];
    }
  }
  function revealCell(i){
    if(!card || settled && revealed>=9) return;
    const cell=$('grid').children[i];
    if(cell.classList.contains('revealed')) return;
    cell.classList.add('revealed');
    if(winSym && card[i]===winSym) cell.classList.add('hit');
    revealed++; sndTick();
    if(revealed>=9) finishReveal();
  }
  function revealAll(){
    if(!card) return;
    for(let i=0;i<9;i++){
      const cell=$('grid').children[i];
      if(!cell.classList.contains('revealed')){
        cell.classList.add('revealed');
        if(winSym && card[i]===winSym) cell.classList.add('hit');
      }
    }
    revealed=9; finishReveal();
  }

  function finishReveal(){
    if(settled) return;
    settled=true;
    busy=false;                              // reactivar ANTES de syncUI
    if(winSym && prizeMult>0){
      const win=BETS[betIdx]*prizeMult;
      balance=NovaWallet.win(win);
      $('winDisp').textContent=fmt(win);
      setMsg(`🎉 ¡3 ${NAMES[winSym]}! Ganaste +${fmt(win)} (x${prizeMult})`);
      sndWin();
      if(window.Juice) Juice.win(win,{ mult:prizeMult, el:$('winDisp') });
    } else {
      setMsg('😕 Sin premio esta vez. ¡Otra raspadita!');
      sndLose();
    }
    $('actBtn').textContent='RASPAR'; $('actBtn').classList.remove('rev');
    syncUI();
  }

  function buyCard(){
    if(busy) return;
    const bet=BETS[betIdx];
    if(balance<bet){ setMsg('Saldo insuficiente.'); return; }
    balance=NovaWallet.bet(bet);
    busy=true; settled=false; revealed=0;
    $('winDisp').textContent=fmt(0);
    newCard(); paintCard();
    $('actBtn').textContent='REVELAR TODO'; $('actBtn').classList.add('rev');
    setMsg('Toca las casillas para raspar… 👆');
    syncUI();
  }

  function setMsg(t){ $('message').textContent=t; }
  function syncUI(){
    $('balance').textContent=fmt(balance);
    $('betDisp').textContent=fmt(BETS[betIdx]);
    $('betVal').textContent=BETS[betIdx];
  }
  function renderLegend(){
    $('legend').innerHTML=SYMS.map(s=>`<b>${ICONS[s]}x${PRIZE[s]}</b>`).join('');
  }

  // ---- eventos ----
  $('grid').addEventListener('click',(e)=>{
    ac();
    const cell=e.target.closest('.cell');
    if(!cell || !busy || !card) return;
    revealCell(+cell.dataset.idx);
  });
  $('actBtn').addEventListener('click',()=>{
    ac();
    if(!busy) buyCard();
    else revealAll();
  });
  $('betUp').addEventListener('click',()=>{ if(!busy && betIdx<BETS.length-1){ betIdx++; syncUI(); } });
  $('betDown').addEventListener('click',()=>{ if(!busy && betIdx>0){ betIdx--; syncUI(); } });

  // ---- init + render inicial ----
  buildGrid(); renderLegend(); syncUI();

  // *** wallet hooks AL FINAL (tras definir $ y todo lo demás) ***
  NovaWallet.ready(b=>{ balance=b; syncUI(); });
  NovaWallet.onBalance(b=>{ balance=b; syncUI(); });
})();
</script>
</body>
</html>
