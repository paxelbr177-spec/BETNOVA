<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1426"/>
      <stop offset="0.5" stop-color="#0e2a4d"/>
      <stop offset="0.82" stop-color="#10416f"/>
      <stop offset="1" stop-color="#0a1426"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.82" cy="0.22" r="0.45">
      <stop offset="0" stop-color="#ffd76a" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#6cb6e8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0e2a4d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="veil" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#070d18" stop-opacity="0.86"/>
      <stop offset="0.5" stop-color="#070d18" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#070d18" stop-opacity="0.28"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#sky)"/>
  <rect width="1200" height="600" fill="url(#sun)"/>

  <!-- Sol de mayo estilizado (arte original), arriba a la derecha -->
  <g transform="translate(1010,120)" fill="#ffd15c" opacity="0.7">
    <g>
      <polygon points="0,-78 5,-46 -5,-46" transform="rotate(0)"/>
      <polygon points="0,-78 5,-46 -5,-46" transform="rotate(30)"/>
      <polygon points="0,-78 5,-46 -5,-46" transform="rotate(60)"/>
      <polygon points="0,-78 5,-46 -5,-46" transform="rotate(90)"/>
      <polygon points="0,-78 5,-46 -5,-46" transform="rotate(120)"/>
      <polygon points="0,-78 5,-46 -5,-46" transform="rotate(150)"/>
      <polygon points="0,-78 5,-46 -5,-46" transform="rotate(180)"/>
      <polygon points="0,-78 5,-46 -5,-46" transform="rotate(210)"/>
      <polygon points="0,-78 5,-46 -5,-46" transform="rotate(240)"/>
      <polygon points="0,-78 5,-46 -5,-46" transform="rotate(270)"/>
      <polygon points="0,-78 5,-46 -5,-46" transform="rotate(300)"/>
      <polygon points="0,-78 5,-46 -5,-46" transform="rotate(330)"/>
    </g>
    <circle r="36" fill="#ffdf85"/>
    <circle r="36" fill="none" stroke="#caa13a" stroke-width="2"/>
  </g>

  <!-- 3 estrellas pequeñas (3 títulos), arriba a la derecha -->
  <g fill="#ffd15c" opacity="0.85">
    <path d="M812 250 l4 12 13 0 -10 8 4 13 -11 -8 -11 8 4 -13 -10 -8 13 0z"/>
    <path d="M858 234 l4 12 13 0 -10 8 4 13 -11 -8 -11 8 4 -13 -10 -8 13 0z"/>
    <path d="M904 250 l4 12 13 0 -10 8 4 13 -11 -8 -11 8 4 -13 -10 -8 13 0z"/>
  </g>

  <!-- Confeti celeste / blanco / dorado, disperso -->
  <g opacity="0.6">
    <circle cx="120" cy="90" r="3" fill="#8fd0ff"/>
    <circle cx="230" cy="160" r="2.5" fill="#ffffff"/>
    <circle cx="340" cy="70" r="2.5" fill="#8fd0ff"/>
    <circle cx="700" cy="50" r="2.5" fill="#ffffff"/>
    <circle cx="980" cy="420" r="2.5" fill="#8fd0ff"/>
    <circle cx="1090" cy="350" r="3" fill="#ffffff"/>
    <circle cx="560" cy="120" r="2.5" fill="#8fd0ff"/>
    <rect x="860" y="330" width="5" height="5" fill="#ffd15c" transform="rotate(20 862 332)"/>
    <rect x="760" y="200" width="5" height="5" fill="#8fd0ff" transform="rotate(35 762 202)"/>
    <rect x="1040" y="470" width="5" height="5" fill="#ffffff" transform="rotate(15 1042 472)"/>
  </g>

  <!-- Estadio estilizado al pie -->
  <g opacity="0.5">
    <ellipse cx="600" cy="650" rx="640" ry="150" fill="#13315a"/>
    <ellipse cx="600" cy="660" rx="480" ry="108" fill="#0c2342"/>
    <ellipse cx="600" cy="664" rx="330" ry="74" fill="#15803d" opacity="0.45"/>
    <g stroke="#3b6ea5" stroke-width="6">
      <line x1="180" y1="560" x2="160" y2="478"/>
      <line x1="1020" y1="560" x2="1040" y2="478"/>
    </g>
    <g fill="#9fd2ff">
      <rect x="132" y="460" width="56" height="18" rx="4"/>
      <rect x="1012" y="460" width="56" height="18" rx="4"/>
    </g>
  </g>

  <!-- Velo para legibilidad del texto -->
  <rect width="1200" height="600" fill="url(#veil)"/>
</svg>
