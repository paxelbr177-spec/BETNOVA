<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#060b16"/>
      <stop offset="0.45" stop-color="#0d2440"/>
      <stop offset="0.8" stop-color="#0a1a30"/>
      <stop offset="1" stop-color="#05080f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.12" r="0.6">
      <stop offset="0" stop-color="#8fd0ff" stop-opacity="0.34"/>
      <stop offset="0.4" stop-color="#4f8fd0" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#4f8fd0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="flood" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.3" stop-color="#cfe8ff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#cfe8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe3ff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#bfe3ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="veil" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#05080f" stop-opacity="0.92"/>
      <stop offset="0.55" stop-color="#05080f" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#05080f" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05080f" stop-opacity="0"/>
      <stop offset="1" stop-color="#05080f" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="#08111f"/>
  <rect width="1200" height="600" fill="url(#sky)"/>
  <rect width="1200" height="600" fill="url(#glow)"/>

  <!-- Haces de luz de reflectores -->
  <g opacity="0.7">
    <polygon points="150,40 250,40 470,420 360,420" fill="url(#beam)"/>
    <polygon points="1050,40 950,40 730,420 840,420" fill="url(#beam)"/>
    <polygon points="600,20 660,20 700,400 560,400" fill="url(#beam)" opacity="0.6"/>
  </g>

  <!-- Bancos de reflectores -->
  <ellipse cx="180" cy="70" rx="150" ry="80" fill="url(#flood)"/>
  <ellipse cx="1020" cy="70" rx="150" ry="80" fill="url(#flood)"/>
  <g fill="#dfeeff">
    <rect x="120" y="58" width="120" height="14" rx="4"/>
    <rect x="960" y="58" width="120" height="14" rx="4"/>
  </g>

  <!-- Confeti celeste / blanco / dorado cayendo -->
  <g opacity="0.85">
    <rect x="180" y="120" width="7" height="11" rx="1.5" fill="#8fd3ff" transform="rotate(18 183 125)"/>
    <rect x="300" y="180" width="6" height="10" rx="1.5" fill="#ffffff" transform="rotate(-22 303 185)"/>
    <rect x="430" y="130" width="6" height="10" rx="1.5" fill="#ffd15c" transform="rotate(30 433 135)"/>
    <rect x="560" y="210" width="7" height="11" rx="1.5" fill="#8fd3ff" transform="rotate(-14 563 215)"/>
    <rect x="690" y="150" width="6" height="10" rx="1.5" fill="#ffffff" transform="rotate(26 693 155)"/>
    <rect x="820" y="200" width="6" height="10" rx="1.5" fill="#ffd15c" transform="rotate(-30 823 205)"/>
    <rect x="930" y="150" width="7" height="11" rx="1.5" fill="#8fd3ff" transform="rotate(16 933 155)"/>
    <rect x="1050" y="220" width="6" height="10" rx="1.5" fill="#ffffff" transform="rotate(-20 1053 225)"/>
    <circle cx="250" cy="250" r="3" fill="#8fd3ff"/>
    <circle cx="500" cy="290" r="2.6" fill="#ffffff"/>
    <circle cx="760" cy="270" r="3" fill="#ffd15c"/>
    <circle cx="1000" cy="300" r="2.6" fill="#8fd3ff"/>
    <circle cx="380" cy="320" r="2.4" fill="#ffffff"/>
  </g>

  <!-- Trofeo dorado, sutil, al fondo derecha -->
  <g transform="translate(900,300)" opacity="0.5" fill="#caa23a">
    <path d="M-34,-58 h68 v18 a34 30 0 0 1 -68 0 z"/>
    <path d="M-34,-52 a-26 24 0 0 1 -22,22 a18 14 0 0 0 22,8 z"/>
    <path d="M34,-52 a26 24 0 0 1 22,22 a18 14 0 0 1 -22,8 z"/>
    <rect x="-7" y="-12" width="14" height="26"/>
    <rect x="-26" y="16" width="52" height="12" rx="3"/>
    <rect x="-34" y="28" width="68" height="12" rx="3"/>
  </g>

  <!-- Multitud (silueta anónima) con luces de celular/banderas -->
  <g>
    <path d="M0,470
      q40,-26 80,-6 q40,18 80,-2 q40,-22 80,0 q40,20 80,-4 q40,-22 80,2
      q40,18 80,-4 q40,-20 80,0 q40,18 80,-6 q40,-22 80,2 q40,20 80,-2
      q40,-22 80,0 q40,18 80,-4 q40,-18 80,2 q40,16 40,6
      L1200,600 L0,600 Z" fill="#0a1322"/>
    <path d="M0,505
      q60,-18 120,-2 q60,16 120,-4 q60,-18 120,2 q60,16 120,-2
      q60,-18 120,0 q60,16 120,-4 q60,-16 120,2 q60,14 120,-2
      q60,-16 120,2 q60,12 60,6 L1200,600 L0,600 Z" fill="#070e1a"/>
    <g fill="#bfe0ff" opacity="0.85">
      <circle cx="90" cy="452" r="2"/><circle cx="180" cy="466" r="1.8"/><circle cx="260" cy="450" r="2"/>
      <circle cx="350" cy="470" r="1.8"/><circle cx="430" cy="452" r="2"/><circle cx="520" cy="468" r="1.8"/>
      <circle cx="610" cy="450" r="2"/><circle cx="700" cy="470" r="1.8"/><circle cx="790" cy="452" r="2"/>
      <circle cx="880" cy="468" r="1.8"/><circle cx="970" cy="452" r="2"/><circle cx="1060" cy="470" r="1.8"/>
      <circle cx="1140" cy="455" r="2"/>
    </g>
    <g fill="#ffffff" opacity="0.6">
      <circle cx="140" cy="488" r="1.6"/><circle cx="300" cy="492" r="1.6"/><circle cx="470" cy="486" r="1.6"/>
      <circle cx="650" cy="492" r="1.6"/><circle cx="820" cy="486" r="1.6"/><circle cx="1000" cy="492" r="1.6"/>
    </g>
  </g>

  <rect width="1200" height="600" fill="url(#floor)"/>
  <rect width="1200" height="600" fill="url(#veil)"/>
</svg>
