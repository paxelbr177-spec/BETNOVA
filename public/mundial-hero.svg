<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c2d52"/>
      <stop offset="0.4" stop-color="#114a82"/>
      <stop offset="0.7" stop-color="#0e2f57"/>
      <stop offset="1" stop-color="#091627"/>
    </linearGradient>
    <radialGradient id="flare1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.25" stop-color="#bfe6ff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#bfe6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="flare2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity="0.85"/>
      <stop offset="0.3" stop-color="#ffd15c" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffd15c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="celA" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0" stop-color="#8fd3ff"/>
      <stop offset="1" stop-color="#5cb3f0"/>
    </linearGradient>
    <linearGradient id="veil" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#070d18" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#070d18" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#070d18" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070d18" stop-opacity="0"/>
      <stop offset="1" stop-color="#070d18" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#sky)"/>

  <!-- Reflectores de estadio (flares) -->
  <ellipse cx="980" cy="90" rx="200" ry="150" fill="url(#flare1)"/>

  <!-- Gradas estilizadas (puntos de luz del público) -->
  <g fill="#bfe0ff" opacity="0.18">
    <rect x="0" y="300" width="1200" height="140"/>
  </g>
  <g fill="#ffffff" opacity="0.5">
    <circle cx="60" cy="330" r="1.6"/><circle cx="120" cy="345" r="1.6"/><circle cx="180" cy="325" r="1.6"/><circle cx="240" cy="350" r="1.6"/>
    <circle cx="300" cy="332" r="1.6"/><circle cx="360" cy="348" r="1.6"/><circle cx="430" cy="328" r="1.6"/><circle cx="500" cy="346" r="1.6"/>
    <circle cx="560" cy="330" r="1.6"/><circle cx="640" cy="350" r="1.6"/><circle cx="720" cy="332" r="1.6"/><circle cx="800" cy="347" r="1.6"/>
    <circle cx="880" cy="329" r="1.6"/><circle cx="960" cy="349" r="1.6"/><circle cx="1040" cy="331" r="1.6"/><circle cx="1120" cy="346" r="1.6"/>
    <circle cx="90" cy="372" r="1.4"/><circle cx="200" cy="388" r="1.4"/><circle cx="330" cy="375" r="1.4"/><circle cx="470" cy="390" r="1.4"/>
    <circle cx="610" cy="374" r="1.4"/><circle cx="760" cy="389" r="1.4"/><circle cx="900" cy="376" r="1.4"/><circle cx="1060" cy="391" r="1.4"/>
  </g>

  <!-- Bandera ondeante: celeste / blanco / celeste con sol de mayo -->
  <g opacity="0.6" transform="rotate(-7 700 300)">
    <path d="M360 150 Q620 110 880 150 Q1140 190 1200 150 L1200 230 Q1140 270 880 230 Q620 190 360 230 Z" fill="url(#celA)"/>
    <path d="M360 230 Q620 190 880 230 Q1140 270 1200 230 L1200 320 Q1140 360 880 320 Q620 280 360 320 Z" fill="#f4fbff"/>
    <path d="M360 320 Q620 280 880 320 Q1140 360 1200 320 L1200 400 Q1140 440 880 400 Q620 360 360 400 Z" fill="url(#celA)"/>
    <!-- Sol de mayo sobre la franja blanca -->
    <g transform="translate(770,278)" fill="#f2b733">
      <g>
        <polygon points="0,-46 4,-27 -4,-27" transform="rotate(0)"/>
        <polygon points="0,-46 4,-27 -4,-27" transform="rotate(30)"/>
        <polygon points="0,-46 4,-27 -4,-27" transform="rotate(60)"/>
        <polygon points="0,-46 4,-27 -4,-27" transform="rotate(90)"/>
        <polygon points="0,-46 4,-27 -4,-27" transform="rotate(120)"/>
        <polygon points="0,-46 4,-27 -4,-27" transform="rotate(150)"/>
        <polygon points="0,-46 4,-27 -4,-27" transform="rotate(180)"/>
        <polygon points="0,-46 4,-27 -4,-27" transform="rotate(210)"/>
        <polygon points="0,-46 4,-27 -4,-27" transform="rotate(240)"/>
        <polygon points="0,-46 4,-27 -4,-27" transform="rotate(270)"/>
        <polygon points="0,-46 4,-27 -4,-27" transform="rotate(300)"/>
        <polygon points="0,-46 4,-27 -4,-27" transform="rotate(330)"/>
      </g>
      <circle r="22" fill="#f7c84b"/>
      <circle r="22" fill="none" stroke="#c99a2e" stroke-width="2"/>
    </g>
  </g>

  <!-- 3 estrellas doradas (3 títulos) arriba a la derecha -->
  <g fill="#ffd76a" opacity="0.95">
    <path d="M1006 70 l5 15 16 0 -13 10 5 16 -13 -10 -13 10 5 -16 -13 -10 16 0z"/>
    <path d="M1060 52 l5 15 16 0 -13 10 5 16 -13 -10 -13 10 5 -16 -13 -10 16 0z"/>
    <path d="M1114 70 l5 15 16 0 -13 10 5 16 -13 -10 -13 10 5 -16 -13 -10 16 0z"/>
  </g>

  <!-- Confeti celeste / blanco / dorado -->
  <g opacity="0.8">
    <rect x="140" y="100" width="7" height="7" fill="#8fd3ff" transform="rotate(20 143 103)"/>
    <rect x="250" y="160" width="6" height="6" fill="#ffffff" transform="rotate(40 253 163)"/>
    <rect x="380" y="90" width="6" height="6" fill="#ffd76a" transform="rotate(15 383 93)"/>
    <rect x="520" y="140" width="7" height="7" fill="#8fd3ff" transform="rotate(55 523 143)"/>
    <rect x="660" y="80" width="6" height="6" fill="#ffffff" transform="rotate(25 663 83)"/>
    <rect x="820" y="120" width="6" height="6" fill="#ffd76a" transform="rotate(35 823 123)"/>
    <rect x="950" y="180" width="7" height="7" fill="#8fd3ff" transform="rotate(10 953 183)"/>
    <circle cx="200" cy="220" r="3.5" fill="#ffffff"/>
    <circle cx="430" cy="200" r="3.5" fill="#8fd3ff"/>
    <circle cx="600" cy="240" r="3" fill="#ffd76a"/>
    <circle cx="880" cy="250" r="3.5" fill="#ffffff"/>
    <circle cx="1080" cy="210" r="3.5" fill="#8fd3ff"/>
  </g>

  <!-- Estadio / césped al pie -->
  <g opacity="0.55">
    <ellipse cx="600" cy="660" rx="660" ry="150" fill="#0f335e"/>
    <ellipse cx="600" cy="672" rx="470" ry="104" fill="#0b2745"/>
    <ellipse cx="600" cy="676" rx="320" ry="70" fill="#1c8a45" opacity="0.5"/>
    <g stroke="#5aa0e0" stroke-width="6">
      <line x1="170" y1="540" x2="150" y2="450"/>
      <line x1="1030" y1="540" x2="1050" y2="450"/>
    </g>
    <ellipse cx="150" cy="445" rx="80" ry="44" fill="url(#flare2)"/>
    <ellipse cx="1050" cy="445" rx="80" ry="44" fill="url(#flare2)"/>
    <g fill="#cfe8ff">
      <rect x="120" y="432" width="60" height="18" rx="4"/>
      <rect x="1020" y="432" width="60" height="18" rx="4"/>
    </g>
  </g>

  <rect width="1200" height="600" fill="url(#floor)"/>
  <rect width="1200" height="600" fill="url(#veil)"/>
</svg>
